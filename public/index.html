    function finishInvoiceAction(reopenOrderId, message) {
      refreshView();
      if (reopenOrderId) openOrderDetails(reopenOrderId);
      else closeModal();
      showToast(message);
    }

    function confirmInvoiceDelivery(invoiceId, reopenOrderId = '') {
      const inv = database.fat.find(f => f.id === invoiceId);
      if (!inv || (!isManager() && inv.vend !== currentUser.id) || inv.ent) return;
      inv.ent = Date.now();
      inv.entPor = currentUser.nome;
      addAuditLog(`Entrega confirmada da fatura ${inv.n}`);
      saveData();
      finishInvoiceAction(reopenOrderId, `Entrega da fatura ${inv.n} confirmada!`);
    }

    function undoInvoiceDelivery(invoiceId, reopenOrderId = '') {
      const inv = database.fat.find(f => f.id === invoiceId);
      if (!inv || (!isManager() && inv.vend !== currentUser.id) || !inv.ent) return;
      delete inv.ent;
      delete inv.entPor;
      addAuditLog(`Entrega desfeita da fatura ${inv.n}`);
      saveData();
      finishInvoiceAction(reopenOrderId, `Entrega da fatura ${inv.n} desfeita.`);
    }

    const PAYMENT_METHODS = ['BOLETO', 'PIX', 'DINHEIRO', 'CHEQUE', 'CARTÃO DE CRÉDITO', 'CARTÃO DE DÉBITO', 'TRANSFERÊNCIA'];
    const roundMoney = v => Math.round((Number(v) || 0) * 100) / 100;
    let paymentDraft = null;

    function openInvoicePaymentConfirm(invoiceId, reopenOrderId = '') {
      const inv = database.fat.find(f => f.id === invoiceId);
      if (!inv || !isManager()) return;
      const fin = invoiceFinance(inv);
      if (fin.saldo < 0.005) return showToast('Esta fatura já está paga.');
      const ped = database.ped.find(p => p.id === inv.ped);
      const combined = String(ped?.formaPag || '').toUpperCase();
      paymentDraft = {
        invoiceId,
        reopenOrderId,
        returnPage: activePage === 'pagar' ? (paymentDraft?.returnPage || 'receber') : activePage,
        lines: [{ id: nextId(), forma: PAYMENT_METHODS.includes(combined) ? combined : 'PIX', valor: fin.saldo, obs: '' }]
      };
      closeModal();
      activePage = 'pagar';
      refreshView();
      window.scrollTo({ top: 0 });
    }

    function paymentSummaryModel() {
      const inv = database.fat.find(f => f.id === paymentDraft.invoiceId);
      const fin = invoiceFinance(inv);
      const lines = paymentDraft.lines;
      const informed = roundMoney(sumCollection(lines, l => Number(l.valor) || 0));
      const rest = roundMoney(fin.saldo - informed);
      const byMethod = {};
      lines.forEach(l => {
        const v = Number(l.valor) || 0;
        if (v > 0) byMethod[l.forma] = roundMoney((byMethod[l.forma] || 0) + v);
      });
      const breakdown = Object.entries(byMethod).map(([m, v]) => `${m}: ${formatCurrency(v)}`).join(' · ');
      let status, tone, canConfirm;
      if (informed <= 0) {
        status = 'Informe o valor recebido em ao menos uma forma de pagamento.';
        tone = 'warn';
        canConfirm = false;
      } else if (rest < -0.005) {
        status = `O total informado passa do saldo em ${formatCurrency(-rest)}.`;
        tone = 'bad';
        canConfirm = false;
      } else if (rest < 0.005) {
        status = 'Pagamento total: a fatura será quitada.';
        tone = 'ok';
        canConfirm = true;
      } else {
        status = `Pagamento parcial: ficará um saldo de ${formatCurrency(rest)} em aberto.`;
        tone = 'warn';
        canConfirm = true;
      }
      return { fin, informed, rest, breakdown, status, tone, canConfirm };
    }

    function updatePaymentSummary() {
      if (!paymentDraft) return;
      const m = paymentSummaryModel();
      const setText = (id, text) => { const el = getEl(id); if (el) el.textContent = text; };
      setText('pay_informed', formatCurrency(m.informed));
      setText('pay_rest', formatCurrency(Math.abs(m.rest)));
      setText('pay_rest_label', m.rest < -0.005 ? 'EXCEDENTE' : 'FALTA');
      setText('pay_breakdown', m.breakdown || '—');
      const restEl = getEl('pay_rest');
      if (restEl) restEl.style.color = m.rest < -0.005 ? 'var(--bad)' : (m.rest < 0.005 ? 'var(--ok)' : 'var(--fg)');
      const statusEl = getEl('pay_status');
      if (statusEl) {
        statusEl.textContent = m.status;
        statusEl.style.color = `var(--${m.tone})`;
      }
      const btn = getEl('pay_confirm_btn');
      if (btn) btn.disabled = !m.canConfirm;
    }

    function payLineSet(lineId, field, value) {
      const line = paymentDraft?.lines.find(l => l.id === lineId);
      if (!line) return;
      line[field] = field === 'valor' ? (Number(String(value).replace(',', '.')) || 0) : value;
      updatePaymentSummary();
    }

    function payLineFill(lineId) {
      if (!paymentDraft) return;
      const line = paymentDraft.lines.find(l => l.id === lineId);
      if (!line) return;
      const m = paymentSummaryModel();
      const others = roundMoney(m.informed - (Number(line.valor) || 0));
      line.valor = Math.max(0, roundMoney(m.fin.saldo - others));
      refreshView();
    }

    function payLineAdd() {
      if (!paymentDraft) return;
      const m = paymentSummaryModel();
      const used = paymentDraft.lines.map(l => l.forma);
      paymentDraft.lines.push({
        id: nextId(),
        forma: PAYMENT_METHODS.find(x => !used.includes(x)) || 'PIX',
        valor: Math.max(0, m.rest),
        obs: ''
      });
      refreshView();
    }

    function payLineRemove(lineId) {
      if (!paymentDraft) return;
      if (paymentDraft.lines.length <= 1) return showToast('Mantenha ao menos uma forma de pagamento.');
      paymentDraft.lines = paymentDraft.lines.filter(l => l.id !== lineId);
      refreshView();
    }

    function leavePaymentPage() {
      const back = paymentDraft?.returnPage || 'receber';
      const reopen = paymentDraft?.reopenOrderId || '';
      paymentDraft = null;
      activePage = PAGES[back] ? back : 'receber';
      refreshView();
      window.scrollTo({ top: 0 });
      return reopen;
    }

    function closePaymentPage() {
      const reopen = leavePaymentPage();
      if (reopen) openOrderDetails(reopen);
    }

    function applyInvoicePayment() {
      if (!paymentDraft || !isManager()) return;
      const inv = database.fat.find(f => f.id === paymentDraft.invoiceId);
      if (!inv) return;
      const fin = invoiceFinance(inv);
      const lines = paymentDraft.lines
        .map(l => ({ forma: l.forma, valor: roundMoney(l.valor), obs: String(l.obs || '').trim() }))
        .filter(l => l.valor > 0);
      if (!lines.length) return showToast('Informe o valor recebido em ao menos uma forma de pagamento.');

      const total = roundMoney(sumCollection(lines, l => l.valor));
      if (total > fin.saldo + 0.005) {
        return showToast(`O total informado (${formatCurrency(total)}) é maior que o saldo da fatura (${formatCurrency(fin.saldo)}).`);
      }

      let remaining = total;
      const aplic = {};
      fin.parcelas
        .filter(r => r.valor - r.pago > 0.004)
        .sort((a, b) => a.venc - b.venc)
        .forEach(r => {
          if (remaining < 0.005) return;
          const take = Math.min(roundMoney(r.valor - r.pago), remaining);
          r.pago = roundMoney(r.pago + take);
          aplic[r.id] = take;
          remaining = roundMoney(remaining - take);
        });

      if (invoiceFinance(inv).saldo < 0.005) {
        fin.parcelas.forEach(r => { r.pago = r.valor; });
      }

      if (!Array.isArray(inv.pagtos)) inv.pagtos = [];
      inv.pagtos.push({ id: nextId(), t: Date.now(), por: currentUser.nome, total, linhas: lines, aplic });

      const after = invoiceFinance(inv);
      if (after.paga) {
        inv.pagoEm = Date.now();
        inv.pagoPor = currentUser.nome;
      }

      evaluateCommissions();
      const resumo = lines.map(l => `${l.forma} ${formatCurrency(l.valor)}`).join(' + ');
      addAuditLog(`Pagamento da fatura ${inv.n}: ${resumo} (total ${formatCurrency(total)}) — ${after.paga ? 'fatura quitada' : 'pagamento parcial'}`);
      saveData();

      const reopen = leavePaymentPage();
      if (reopen) openOrderDetails(reopen);
      showToast(after.paga ? `Pagamento da fatura ${inv.n} confirmado!` : `Pagamento parcial de ${formatCurrency(total)} registrado na fatura ${inv.n}.`);
    }

    function undoInvoicePayment(invoiceId, reopenOrderId = '') {
      const inv = database.fat.find(f => f.id === invoiceId);
      if (!inv || !isManager()) return;
      const hasLog = Array.isArray(inv.pagtos) && inv.pagtos.length > 0;
      if (!hasLog && !inv.pagoSnap) return;
      const commission = database.com.find(c => c.fat === inv.id);
      if (commission && commission.st === 'Paga') {
        return showToast('A comissão desta fatura já foi paga; não é possível desfazer o pagamento.');
      }

      if (hasLog) {
        const last = inv.pagtos.pop();
        Object.entries(last.aplic || {}).forEach(([receiptId, value]) => {
          const receipt = database.rec.find(r => r.id === receiptId);
          if (receipt) receipt.pago = Math.max(0, roundMoney(receipt.pago - value));
        });
      } else {
        Object.entries(inv.pagoSnap).forEach(([receiptId, before]) => {
          const receipt = database.rec.find(r => r.id === receiptId);
          if (receipt) receipt.pago = before;
        });
        delete inv.pagoSnap;
      }
      delete inv.pagoEm;
      delete inv.pagoPor;

      if (commission && commission.st === 'Liberada' && database.cfg.liberaApos) commission.st = 'Apurada';
      evaluateCommissions();
      addAuditLog(`Pagamento desfeito da fatura ${inv.n}`);
      saveData();
      finishInvoiceAction(reopenOrderId, `Pagamento da fatura ${inv.n} desfeito.`);
    }

    function convertToOrder(quoteId) {
      const quote = database.orc.find(x => x.id === quoteId);
      if (!quote || quote.ped) return null;
      if (!isManager() && quote.vend !== currentUser.id) {
        showToast('Só o vendedor responsável ou um gerente pode alterar este registro.');
        return null;
      }

      const numberTaken = database.ped.some(p => p.n === quote.n);

      const order = {
        id: nextId(),
        n: numberTaken ? nextSeqNumber('p') : quote.n,
        orc: quote.id,
        cli: quote.cli,
        vend: quote.vend,
        vendNome: quote.vendNome || getEntityName('users', quote.vend),
        data: Date.now(),
        dataEntrega: quote.dataEntrega || todayIso(),
        itens: quote.itens.map(i => ({ ...i, fat: 0 })),
        frete: quote.frete,
        outros: quote.outros || 0,
        parc: quote.parc,
        formaPag: quote.formaPag || 'CHEQUE',
        condPag: quote.condPag || '30 Dias',
        obs: quote.obs || '',
        st: 'Aprovado',
        hist: [[Date.now(), currentUser.nome, `Criado a partir do orçamento ${quote.n}`]]
      };

      database.ped.push(order);
      quote.ped = order.id;
      quote.st = 'Convertido em pedido';
      quote.hist.push([Date.now(), currentUser.nome, `Convertido no pedido ${order.n}`]);

      addAuditLog(`Orçamento ${quote.n} convertido no pedido ${order.n}`);
      saveData();
      refreshView();
      showToast(numberTaken
        ? `Pedido ${order.n} gerado! O número ${quote.n} já estava em uso por outro pedido.`
        : `Pedido ${order.n} gerado com o mesmo número do orçamento!`);
      return order;
    }

    function openOrderDetails(orderId) {

        ${renderTable(['Código / Descrição do Cabo', 'Unid.', 'Qtd / Metros', 'Faturado', 'Saldo', 'Faturar agora'], order.itens.map((item, index) => {

        <p class="mut" style="font-size:12px">Histórico: ${order.hist.map(h => `${formatDate(h[0])} ${escapeHtml(h[2])}`).join(' · ')}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center">
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button onclick="closeModal();openPrintPreview('ped', '${order.id}')">${icon('printer')} Imprimir Pedido (Modelo Cabolândia)</button>

            <button class="secondary" onclick="closeModal()">Fechar</button>
          </div>
          <button class="danger-outline" onclick="confirmDeleteOrder('${order.id}')">${icon('trash')} Excluir Pedido</button>
        </div>`);
    }

    function openPrintPreview(type, id, forceTitleMode = null) {
      const collection = type === 'orc' ? database.orc : database.ped;
      const doc = collection.find(x => x.id === id);
      if (!doc) return showToast('Registro não encontrado para impressão.');

      const client = database.cli.find(c => c.id === doc.cli) || {};
      const emp = getCompanyInfo();
      const sellerName = doc.vendNome || (database.users.find(u => u.id === doc.vend)?.nome) || 'Thiago';

      const docLabelTitle = forceTitleMode || (type === 'orc' ? 'ORÇAMENTO DE VENDA' : 'PEDIDO DE VENDA');
      const topDocLabel = docLabelTitle === 'ORÇAMENTO DE VENDA' ? `Orçamento: ${doc.n}` : `Pedido: ${doc.n}`;

      if (printPrevTitle === null) printPrevTitle = document.title;
      document.title = `${docLabelTitle === 'ORÇAMENTO DE VENDA' ? 'Orçamento' : 'Pedido'} (${String(doc.n).replace(/[\\/:*?"<>|]/g, '-')})`;

      let totalQty = 0;
      let grossItemsSum = 0;
      let totalDiscountSum = 0;
      let netItemsSum = 0;

      const itemRowsHtml = doc.itens.map(item => {
        const prod = database.prod.find(p => p.id === item.p) || { sku: '—', nome: 'PRODUTO EXCLUÍDO', un: 'UN' };
        const qty = Number(item.q) || 0;
        const unitPrice = Number(item.pu) || 0;
        const discountPct = Number(item.d) || 0;
        const grossLine = qty * unitPrice;
        const discountVal = grossLine * (discountPct / 100);
        const netLine = grossLine - discountVal;

        totalQty += qty;
        grossItemsSum += grossLine;
        totalDiscountSum += discountVal;
        netItemsSum += netLine;

        return `
          <tr>
            <td>${escapeHtml(prod.sku)}</td>
            <td>${escapeHtml(prod.nome)}</td>
            <td style="text-align:center">${escapeHtml(getUnitLabel(prod.un))}</td>
            <td style="text-align:center">${formatNumber(qty, 3)}</td>
            <td style="text-align:right">${formatCurrency(unitPrice)}</td>
            <td style="text-align:right">${formatCurrency(discountVal)}</td>
            <td style="text-align:right">${formatCurrency(netLine)}</td>
          </tr>
        `;
      }).join('');

      const freteVal = Number(doc.frete) || 0;
      const outrosVal = Number(doc.outros) || 0;
      const grandTotal = netItemsSum + freteVal + outrosVal;

      const installmentsCount = Number(doc.parc) || 1;
      const formaPag = (doc.formaPag || 'CHEQUE').toUpperCase();

    function processInvoice(orderId) {
      const order = database.ped.find(x => x.id === orderId);
      if (!isManager() || !order || !['Aprovado', 'Parcialmente faturado'].includes(order.st)) return;

      const quantities = order.itens.map((item, index) => {
        const input = getEl(`invoice_qty_${index}`);
        return input ? Number(input.value) || 0 : 0;
      });

      const hasInvalidQuantities = quantities.some((qty, i) => qty < 0 || qty > (order.itens[i].q - order.itens[i].fat));
      if (hasInvalidQuantities || !quantities.some(q => q > 0)) {
        return showToast('Informe quantidades maiores que zero e dentro do saldo do pedido');
      }

      let netAmount = 0;
      order.itens.forEach((item, index) => {
        const invoiceQty = quantities[index];
        item.fat += invoiceQty;
        netAmount += invoiceQty * item.pu * (1 - item.d / 100);

        const catalogItem = database.prod.find(x => x.id === item.p);
        if (catalogItem && catalogItem.est != null) {
          catalogItem.est -= invoiceQty;
        }
      });
      netAmount = Math.round(netAmount * 100) / 100;

      const isFirstInvoice = !database.fat.some(x => x.ped === order.id);
      const freightCost = isFirstInvoice ? Number(order.frete || 0) : 0;
      const invoiceTotal = Math.round((netAmount + freightCost) * 100) / 100;

      const invoice = {
        id: nextId(),
        n: nextSeqNumber('f'),
        ped: order.id,
        cli: order.cli,
        vend: order.vend,
        data: Date.now(),
        liq: netAmount,
        total: invoiceTotal
      };
      database.fat.push(invoice);

      order.st = order.itens.every(i => i.fat >= i.q) ? 'Faturado' : 'Parcialmente faturado';
      order.hist.push([Date.now(), currentUser.nome, `Faturamento ${invoice.n}`]);

      const installmentsCount = order.parc || 1;
      const baseInstallmentValue = Math.round((invoice.total / installmentsCount) * 100) / 100;
      let installmentSum = 0;

      for (let k = 1; k <= installmentsCount; k++) {
        const value = k < installmentsCount ? baseInstallmentValue : Math.round((invoice.total - installmentSum) * 100) / 100;
        installmentSum += value;
        database.rec.push({
          id: nextId(),
          fat: invoice.id,
          n: invoice.n,
          cli: order.cli,
          vend: order.vend,
          parc: `${k}/${installmentsCount}`,
          venc: Date.now() + termDays(order.condPag) * 86400000 * k,
          valor: value,
          pago: 0
        });
      }

      const seller = database.users.find(x => x.id === order.vend);
      const commissionRate = seller ? seller.pct : 0;

      if (!database.com.some(c => c.fat === invoice.id)) {
        database.com.push({
          id: nextId(),
          fat: invoice.id,
          n: invoice.n,
          ped: order.n,
          cli: order.cli,
          vend: order.vend,
          base: netAmount,
          pct: commissionRate,
          valor: Math.round(netAmount * commissionRate) / 100,
          st: 'Apurada'
        });
      }

      evaluateCommissions();
      addAuditLog(`Faturamento ${invoice.n} do pedido ${order.n}`);
      saveData();
      closeModal();
      refreshView();
      showToast(`Faturamento ${invoice.n} registrado!`);
    }

    function evaluateCommissions() {
      database.com.forEach(entry => {
        if (entry.st !== 'Apurada') return;
        const relatedReceipts = database.rec.filter(x => x.fat === entry.fat);
        const isFullyPaid = relatedReceipts.every(x => (x.valor - x.pago) < 0.005);

        if (!database.cfg.liberaApos || isFullyPaid) {
          entry.st = 'Liberada';
        }
      });
    }

    function settleReceipt(receiptId) {
      if (!isManager()) return;
      const receipt = database.rec.find(x => x.id === receiptId);
      const paymentAmount = Math.round(Number(getVal(`receipt_${receiptId}`)) * 100) / 100;

      if (!receipt || !(paymentAmount > 0) || paymentAmount > (receipt.valor - receipt.pago + 0.005)) {
        return showToast('Informe um valor maior que zero e até o saldo da parcela');
      }

      receipt.pago = Math.round((receipt.pago + paymentAmount) * 100) / 100;
      evaluateCommissions();
      addAuditLog(`Recebimento de ${formatCurrency(paymentAmount)} na fatura ${receipt.n}`);
      saveData();
      refreshView();
      showToast('Recebimento registrado!');
    }

    function payCommission(commissionId) {
      if (!isAdmin()) return;
      const commission = database.com.find(x => x.id === commissionId);
      if (!commission || commission.st !== 'Liberada') return;

      commission.st = 'Paga';
      addAuditLog(`Comissão da fatura ${commission.n} marcada como paga`);
      saveData();
      refreshView();
    }

    async function saveUser() {
      if (!isAdmin()) return;
      const email = getVal('usr_email').trim().toLowerCase();
      const commissionRate = Number(getVal('usr_pct'));
      const name = getVal('usr_name').trim();
      const password = getVal('usr_pass');
      const role = getVal('usr_role');

      if (!name || !email.includes('@') || password.length < 6) {
        return showToast('Informe nome, e-mail válido e senha com 6 ou mais caracteres');
      }
      if (!(commissionRate >= 0 && commissionRate <= 100)) {
        return showToast('Percentual de comissão inválido');
      }
      if (database.users.some(u => u.email === email)) {
        return showToast('Este e-mail já está cadastrado');
      }

      database.users.push({
        id: nextId(),
        nome: name,
        email,
        h: await sha256(password),
        role,
        pct: commissionRate,
        ativo: 1
      });

      addAuditLog(`Usuário ${email} criado`);
      await saveData();
      closeModal();
      refreshView();
    }

      user.pct = parsedPercentage;

      saveData();
      showToast('Percentual atualizado.');
    }

    const PDF_LETTER = { a: '[aáàâãä]', c: '[cç]', e: '[eéèêë]', i: '[iíìî]', o: '[oóòôõö]', u: '[uúùûü]' };
    const pdfLabel = word => word.split('').map(ch => {
      if (ch === ' ') return '\\s*';
      return PDF_LETTER[ch.toLowerCase()] || ch.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
    }).join('\\s*');
    const pdfSquash = s => normText(s).replace(/[^a-z0-9]/g, '').toUpperCase();
    const pdfBR = s => {
      const n = parseFloat(String(s ?? '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.'));
      return isFinite(n) ? n : 0;
    };
    const pdfDateIso = s => {
      const m = String(s || '').replace(/\s/g, '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
      return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
    };
    const PDF_MONEY = '(\\d{1,3}(?:\\.\\d{3})*,\\d{2,4}|\\d+,\\d{2,4})';
    const PDF_ITEM_RE = new RegExp(
      '^([A-Za-z0-9][A-Za-z0-9._\\-/]*)\\s+(.+?)\\s+([A-Za-zÀ-ÿ.]+)\\s+(\\d{1,3}(?:\\.\\d{3})*,\\d{1,4}|\\d+,\\d{1,4})' +
      '\\s+(?:R\\$\\s*)?' + PDF_MONEY + '\\s+(?:R\\$\\s*)?' + PDF_MONEY + '\\s+(?:R\\$\\s*)?' + PDF_MONEY + '\\s*$'
    );

    function pdfMapPayMethod(desc) {
      const s = pdfSquash(desc);
      if (s.includes('PIX')) return 'PIX';
      if (s.includes('BOLETO')) return 'BOLETO';
      if (s.includes('DINHEIRO')) return 'DINHEIRO';
      if (s.includes('CHEQUE')) return 'CHEQUE';
      if (s.includes('CREDITO')) return 'CARTÃO DE CRÉDITO';
      if (s.includes('DEBITO')) return 'CARTÃO DE DÉBITO';
      if (s.includes('TRANSFER')) return 'TRANSFERÊNCIA';
      if (s.includes('CARTEIRA') || s.includes('PRAZO')) return 'A PRAZO / CARTEIRA';
      return '';
    }

    function parseOrderPdfLines(rawLines) {
      const lines = rawLines.map(l => String(l).replace(/\s+/g, ' ').trim()).filter(Boolean);
      const text = lines.join('\n');
      const squashed = pdfSquash(text);
      const doc = {
        titulo: squashed.includes('ORCAMENTODEVENDA') ? 'ORCAMENTO' : squashed.includes('PEDIDODEVENDA') ? 'PEDIDO' : '',
        numero: '', vendedor: '', cliente: '', fantasia: '', telefone: '',
        criacao: '', entrega: '', end: { log: '', num: '', bairro: '', cep: '', cid: '', uf: '' },
        itens: [], totalItens: null, desconto: 0, frete: 0, outros: 0, totalPdf: null,
        pagamentos: [], obs: ''
      };

      const grab = (label, tail = '([^\\n]*)') => {
        const m = text.match(new RegExp(pdfLabel(label) + '\\s*:\\s*' + tail, 'i'));
        return m ? m[1].trim() : '';
      };

      doc.numero = grab('Pedido', '(\\d+)') || grab('Orcamento', '(\\d+)');
      doc.vendedor = grab('Vendedor');
      const cli = grab('Cliente');
      const cm = cli.match(/^(.*?)\s*\((.*)\)\s*$/);
      doc.cliente = (cm ? cm[1] : cli).trim();
      doc.fantasia = cm && pdfSquash(cm[2]) !== pdfSquash(cm[1]) ? cm[2].trim() : '';
      doc.telefone = grab('Telefone');

      const dateAfter = label => {
        const m = text.match(new RegExp(pdfLabel(label) + '\\s*:[^\\n]*?(\\d{2}/\\d{2}/\\d{4})', 'i'));
        return m ? pdfDateIso(m[1]) : '';
      };
      doc.criacao = dateAfter('Data de criacao');
      doc.entrega = dateAfter('Data de entrega');

      const addrStart = text.search(new RegExp(pdfLabel('Endereco de cobranca'), 'i'));
      if (addrStart >= 0) {
        let seg = text.slice(addrStart);
        const cut = seg.search(new RegExp(pdfLabel('Endereco de entrega') + '|' + pdfLabel('Itens do'), 'i'));
        if (cut > 0) seg = seg.slice(0, cut);
        const pick = (label, next) => {
          const m = seg.match(new RegExp(pdfLabel(label) + '\\s*:\\s*(.*?)\\s*(?:' + next + ')', 'i'));
          return m ? m[1].replace(/\s+/g, ' ').trim() : '';
        };
        doc.end.log = pick('Endereco', pdfLabel('Numero') + '\\s*:');
        const nm = seg.match(new RegExp(pdfLabel('Numero') + '\\s*:\\s*([^\\n]*)', 'i'));
        doc.end.num = nm ? nm[1].trim() : '';
        doc.end.bairro = pick('Bairro', pdfLabel('CEP') + '\\s*:');
        doc.end.cep = pick('CEP', pdfLabel('Cidade') + '\\s*:').replace(/\s/g, '');
        doc.end.cid = pick('Cidade', pdfLabel('Estado') + '\\s*:');
        const um = seg.match(new RegExp(pdfLabel('Estado') + '\\s*:\\s*([A-Za-z]{2})', 'i'));
        doc.end.uf = um ? um[1].toUpperCase() : '';
      }

      let from = lines.findIndex(l => pdfSquash(l).includes('ITENSDO'));
      if (from < 0) from = 0;
      let to = lines.findIndex((l, i) => i > from && /QUANTIDADEDEITENS|VALORTOTALDEPEDIDO|VALORTOTALDOSITENS/.test(pdfSquash(l)));
      if (to < 0) to = lines.length;
      let buf = '';
      let tries = 0;
      for (let i = from + 1; i < to; i++) {
        if (/^REFERENCIA/.test(pdfSquash(lines[i]))) { buf = ''; tries = 0; continue; }
        let m = lines[i].match(PDF_ITEM_RE);
        if (m) buf = '';
        else {
          buf = buf ? buf + ' ' + lines[i] : lines[i];
          m = buf.match(PDF_ITEM_RE);
        }
        if (m) {
          doc.itens.push({
            sku: m[1].toUpperCase(), desc: m[2].trim(), un: m[3], q: pdfBR(m[4]),
            pu: pdfBR(m[5]), desc_r: pdfBR(m[6]), total: pdfBR(m[7])
          });
          buf = ''; tries = 0;
        } else if (++tries > 4) {
          buf = ''; tries = 0;
        }
      }

      const ti = lines.findIndex(l => { const s = pdfSquash(l); return s.includes('TOTALDOSITENS') && s.includes('FRETE'); });
      if (ti >= 0) {
        for (let k = ti + 1; k <= ti + 3 && k < lines.length; k++) {
          const vals = [...lines[k].matchAll(/R\$\s*(\d[\d.]*,\d{2})/g)].map(x => pdfBR(x[1]));
          if (vals.length >= 4) {
            doc.totalItens = vals[0]; doc.desconto = vals[1]; doc.frete = vals[2]; doc.outros = vals[3];
            if (vals.length >= 5) doc.totalPdf = vals[4];
            break;
          }
        }
      }

      const pi = lines.findIndex(l => pdfSquash(l).includes('FORMACONDICOESDEPAGAMENTO'));
      if (pi >= 0) {
        for (let k = pi + 1; k < lines.length; k++) {
          const sq = lines[k].replace(/\s+/g, '');
          if (/^OBSERVA/i.test(pdfSquash(lines[k]))) break;
          const m = sq.match(/^(.*?)\[(\d+)\/(\d+)\](\d{2}\/\d{2}\/\d{4})(?:(\d{2}\/\d{2}\/\d{4}))?(\d{1,3}(?:\.\d{3})*,\d{2})/);
          if (m) {
            doc.pagamentos.push({ desc: m[1], idx: Number(m[2]), parc: Number(m[3]), venc: pdfDateIso(m[4]), valor: pdfBR(m[6]) });
          }
        }
      }

      if (doc.totalPdf === null && doc.pagamentos.length) doc.totalPdf = Math.round(doc.pagamentos.reduce((a, p) => a + p.valor, 0) * 100) / 100;

      const oi = lines.findIndex(l => pdfSquash(l) === 'OBSERVACOES');
      if (oi >= 0) {
        const parts = [];
        for (let k = oi + 1; k < lines.length; k++) {
          if (/^ASSINATURA/.test(pdfSquash(lines[k]))) break;
          if (/^Pedido\s*:\s*\d+$/i.test(lines[k]) || /^EMITIDO/i.test(lines[k])) continue;
          parts.push(lines[k]);
        }
        doc.obs = parts.join(' ').trim();
      }

      return doc;
    }

    let pdfJsPromise = null;
    function loadPdfJs() {
      if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
      if (pdfJsPromise) return pdfJsPromise;
      pdfJsPromise = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        s.onload = () => {
          try {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            resolve(window.pdfjsLib);
          } catch (e) { pdfJsPromise = null; reject(e); }
        };
        s.onerror = () => { pdfJsPromise = null; reject(new Error('Não consegui carregar o leitor de PDF. Verifique a internet e tente de novo.')); };
        document.head.appendChild(s);
      });
      return pdfJsPromise;
    }

    async function pdfToLines(file) {
      const pdfjs = await loadPdfJs();
      const pdf = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      const out = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const content = await (await pdf.getPage(p)).getTextContent();
        const rows = [];
        content.items.forEach(it => {
          if (!it.str || !it.str.trim()) return;
          const x = it.transform[4], y = it.transform[5];
          let row = rows.find(r => Math.abs(r.y - y) <= 3);
          if (!row) { row = { y, parts: [] }; rows.push(row); }
          row.parts.push({ x, w: it.width || 0, s: it.str, h: Math.abs(it.transform[3]) || 8 });
        });
        rows.sort((a, b) => b.y - a.y).forEach(r => {
          r.parts.sort((a, b) => a.x - b.x);
          let line = '';
          let prev = null;
          r.parts.forEach(pt => {
            if (prev && pt.x - (prev.x + prev.w) > pt.h * 0.18) line += ' ';
            line += pt.s;
            prev = pt;
          });
          out.push(line);
        });
        out.push('');
      }
      return out;
    }

    const pdfNorm = s => normText(s).replace(/[^a-z0-9]+/g, ' ').trim();

    function pdfPayInfo(doc) {
      const pays = doc.pagamentos;
      if (!pays.length) return { forma: '', parc: 1, termo: 'À Vista' };
      const main = pays.slice().sort((a, b) => b.valor - a.valor)[0];
      const same = pays.filter(p => p.desc === main.desc);
      const first = same.slice().sort((a, b) => a.idx - b.idx)[0];
      let termo = 'À Vista';
      if (!pdfSquash(main.desc).includes('AVISTA') && first.venc && doc.criacao) {
        const days = Math.round((Date.parse(first.venc) - Date.parse(doc.criacao)) / 86400000);
        if (days > 0) {
          const opts = [7, 14, 21, 28, 30, 45, 60, 90];
          const best = opts.reduce((a, b) => Math.abs(b - days) < Math.abs(a - days) ? b : a);
          termo = `${best} Dias`;
        }
      }
      return { forma: pdfMapPayMethod(main.desc), parc: Math.max(...same.map(p => p.parc), 1), termo };
    }

    function preparePdfImportDoc(doc) {
      const bySku = new Map(database.prod.map(p => [String(p.sku).trim().toUpperCase(), p]));
      doc.itens.forEach(it => { it.prod = bySku.get(it.sku) || null; });

      const gross = it => it.q * it.pu;
      const net = it => gross(it) - (it.desc_r || 0);
      const sumNet = doc.itens.reduce((a, it) => a + net(it), 0);
      doc.itens.forEach(it => {
        const extra = sumNet > 0 ? doc.desconto * net(it) / sumNet : 0;
        const g = gross(it);
        it.d = g > 0 ? Math.round(((it.desc_r || 0) + extra) / g * 1e8) / 1e6 : 0;
      });

      const calc = doc.itens.reduce((a, it) => a + gross(it) * (1 - it.d / 100), 0) + doc.frete + doc.outros;
      doc.totalCalc = Math.round(calc * 100) / 100;
      doc.totalConfere = doc.totalPdf === null || Math.abs(doc.totalCalc - doc.totalPdf) < 0.02;

      const target = pdfNorm(doc.cliente);
      const fant = pdfNorm(doc.fantasia);
      doc.clienteExato = database.cli.find(c => {
        const n = pdfNorm(c.nome), f = pdfNorm(c.fantasia);
        return n && (n === target || (fant && n === fant) || (f && (f === target || (fant && f === fant))));
      }) || null;
      let cands = searchClients(database.cli, doc.cliente);
      if (!cands.length) {
        const longest = doc.cliente.split(/\s+/).sort((a, b) => b.length - a.length)[0] || '';
        if (longest.length >= 3) cands = searchClients(database.cli, longest);
      }
      doc.candidatos = cands.filter(c => c !== doc.clienteExato).slice(0, 8);
      doc.pay = pdfPayInfo(doc);
      doc.alvo = pdfImportTarget;
      return doc;
    }

    async function nextPdfImport() {
      const file = pdfImportQueue.shift();
      if (!file) { pdfImportDoc = null; return; }
      try {
        const lines = await pdfToLines(file);
        const doc = parseOrderPdfLines(lines);
        doc.arquivo = file.name;
        if (!doc.itens.length) {
          showToast(`Não encontrei itens em "${file.name}". Use o PDF no modelo Pedido de Venda.`);
          return nextPdfImport();
        }
        pdfImportDoc = preparePdfImportDoc(doc);
        renderPdfImportPreview();
      } catch (err) {
        console.error(err);
        showToast(err && err.message ? err.message : `Erro ao ler "${file.name}".`);
        return nextPdfImport();
      }
    }

    function pdfNumberTaken(n, target) {
      return database.orc.some(o => o.n === n) || (target === 'ped' && database.ped.some(p => p.n === n));

        <div class="form-layout">

            </div>`).join('')}
        </div>

        <div style="background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;margin-bottom:14px">
          <div style="display:flex;justify-content:space-between"><span>Itens</span><b>${formatCurrency(doc.totalItens ?? doc.itens.reduce((a, i) => a + i.q * i.pu, 0))}</b></div>
          ${doc.desconto ? `<div style="display:flex;justify-content:space-between"><span>Desconto (dividido entre os itens)</span><b>− ${formatCurrency(doc.desconto)}</b></div>` : ''}
          ${doc.frete ? `<div style="display:flex;justify-content:space-between"><span>Frete</span><b>${formatCurrency(doc.frete)}</b></div>` : ''}
          ${doc.outros ? `<div style="display:flex;justify-content:space-between"><span>Outros</span><b>${formatCurrency(doc.outros)}</b></div>` : ''}
          <div style="display:flex;justify-content:space-between;font-size:15px"><span>Total</span><b>${formatCurrency(doc.totalCalc)}</b></div>
        </div>

        <div class="form-layout">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div>
              <label>Forma de pagamento</label>
              <select id="pdfimp_pay">${payMethods.map(m => `<option value="${m}" ${m === (doc.pay.forma || 'CHEQUE') ? 'selected' : ''}>${m}</option>`).join('')}</select>
            </div>
            <div>
              <label>Prazo</label>
              <select id="pdfimp_terms">${termOptionsHtml(doc.pay.termo)}</select>
            </div>
            <div>
              <label>Parcelas</label>
              <select id="pdfimp_parc">${[1, 2, 3, 4, 5, 6, 8, 10, 12].map(n => `<option value="${n}" ${n === doc.pay.parc ? 'selected' : ''}>${String(n).padStart(2, '0')}x</option>`).join('')}</select>
            </div>
            <div>
              <label>Data de entrega</label>
              <input id="pdfimp_entrega" type="date" value="${escapeHtml(doc.entrega || todayIso())}">
            </div>
          </div>
          <label>Observações</label>
          <input id="pdfimp_obs" value="${escapeHtml(doc.obs || '')}" placeholder="Observações">
        </div>

        <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
          <button onclick="confirmPdfImport()">${icon('download')} Importar</button>
          ${pdfImportQueue.length ? `<button class="secondary" onclick="skipPdfImport()">Pular este</button>` : ''}
          <button class="secondary" onclick="cancelPdfImport()">Cancelar</button>
        </div>
      `);
    }

    function nextSeqPreview() {
      let n = (Number(database.seq.o) || 0) + 1;
      while (pdfNumberTaken(String(n).padStart(4, '0'), 'ped')) n++;
      return String(n).padStart(4, '0');
    }

    function skipPdfImport() { closeModal(); nextPdfImport(); }
    function cancelPdfImport() { pdfImportQueue = []; pdfImportDoc = null; closeModal(); }

    async function confirmPdfImport() {
      const doc = pdfImportDoc;
      if (!doc) return;
      const target = getVal('pdfimp_target') === 'ped' ? 'ped' : 'orc';
      const digits = onlyDigits(getVal('pdfimp_n'));
      if (!digits) return showToast('Informe o número.');
      const n = digits.padStart(4, '0');
      if (pdfNumberTaken(n, target)) return showToast(`O número ${n} já está em uso. Escolha outro.`);

      const okItems = doc.itens.filter(i => i.prod);
      if (!okItems.length) return showToast('Nenhum item do PDF existe no catálogo.');
      if (!isAdmin()) {
        const bad = okItems.find(i => !checkPriceLock(i.prod.id, i.pu).ok);
        if (bad) return showToast(checkPriceLock(bad.prod.id, bad.pu).msg);
      }

      const sellerName = (getVal('pdfimp_seller') || '').trim() || currentUser.nome;
      let client;
      const cliSel = getVal('pdfimp_cli');
      if (cliSel === '__new__') {
        client = {
          id: nextId(), codSis: '', tipo: 'J', nome: doc.cliente, fantasia: doc.fantasia || '', doc: '', ie: '', email: '',
          tel: doc.telefone || '', cep: doc.end.cep || '', log: doc.end.log || '', num: doc.end.num || '', comp: '',
          bairro: doc.end.bairro || '', cid: doc.end.cid || 'Alfenas', uf: doc.end.uf || 'MG',
          vend: currentUser.id, vendNome: sellerName, ativo: 1
        };
        database.cli.push(client);
        addAuditLog(`Cliente ${client.nome} criado pela importação de PDF`);
      } else {
        client = database.cli.find(c => c.id === cliSel);
      }
      if (!client) return showToast('Escolha o cliente.');

      let created = Date.now();
      if (doc.criacao) {
        const [y, m, d] = doc.criacao.split('-').map(Number);
        created = new Date(y, m - 1, d, 12, 0, 0).getTime();
      }

      const quote = {
        id: nextId(),
        n,
        cli: client.id,
        vend: currentUser.role === 'vendedor' ? currentUser.id : (client.vend || currentUser.id),
        vendNome: sellerName,
        data: created,
        dataEntrega: getVal('pdfimp_entrega') || doc.entrega || todayIso(),
        itens: okItems.map(i => ({ p: i.prod.id, q: i.q, pu: i.pu, d: i.d })),
        frete: doc.frete || 0,
        outros: doc.outros || 0,
        parc: Number(getVal('pdfimp_parc')) || 1,
        formaPag: getVal('pdfimp_pay') || 'CHEQUE',
        condPag: getVal('pdfimp_terms') || 'À Vista',
        obs: getVal('pdfimp_obs') || '',
        st: target === 'ped' ? 'Aprovado pelo cliente' : 'Rascunho',
        ped: null,
        hist: [[Date.now(), currentUser.nome, `Importado de PDF (${doc.arquivo})`]]
      };

      database.orc.push(quote);
      const seqNum = Number(n);
      if (Number.isFinite(seqNum) && seqNum > (Number(database.seq.o) || 0)) database.seq.o = seqNum;
      addAuditLog(`PDF importado: ${target === 'ped' ? 'pedido' : 'orçamento'} ${n} (${client.nome})`);

      let order = null;
      if (target === 'ped') {
        order = convertToOrder(quote.id);
        if (order) {
          order.data = created;
          order.hist = [[Date.now(), currentUser.nome, `Importado de PDF (${doc.arquivo})`]];
        }
      }

      await saveData();
      closeModal();
      refreshView();
      showToast(`${target === 'ped' ? 'Pedido' : 'Orçamento'} ${n} importado com ${okItems.length} item(ns).`);
      pdfImportDoc = null;
      if (pdfImportQueue.length) setTimeout(nextPdfImport, 400);
    }

    function fitPrintSheet() {
      const sheet = document.querySelector('#print-overlay .print-sheet');
      if (!sheet) return;
      const avail = window.innerWidth - 20;
      if (avail >= 820) {
        sheet.style.zoom = '';
        sheet.style.width = '';
        sheet.style.maxWidth = '';
        return;
      }
      sheet.style.width = '820px';
      sheet.style.maxWidth = 'none';
      sheet.style.zoom = String(Math.max(0.3, avail / 820));
    }
    window.addEventListener('resize', fitPrintSheet);

    setInterval(enforceSessionExpiry, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) enforceSessionExpiry(); });
    window.addEventListener('focus', enforceSessionExpiry);
    window.addEventListener('pageshow', enforceSessionExpiry);

    const CABLE_PREFIX = { VM: 'vm', PT: 'pt', AZ: 'az', VD: 'vd', BR: 'br', AM: 'am' };
    const CABLE_NAME = { vm: 'vermelho', pt: 'preto', az: 'azul', vd: 'verde', br: 'branco', am: 'amarelo' };

    function tagCableColors() {
      document.querySelectorAll('.sku-pill:not([data-cor])').forEach(el => {
        const match = el.textContent.trim().toUpperCase().match(/^(VM|PT|AZ|VD|BR|AM)\d/);
        const color = match ? CABLE_PREFIX[match[1]] : '';
        el.dataset.cor = color;
        if (color) el.title = `Cabo ${CABLE_NAME[color]}`;
      });
    }

    let cableTagQueued = false;
    new MutationObserver(() => {
      if (cableTagQueued) return;
      cableTagQueued = true;
      requestAnimationFrame(() => { cableTagQueued = false; tagCableColors(); });
    }).observe(document.body, { childList: true, subtree: true });

    function placeNavIndicator() {
      const list = document.querySelector('.nav-list');
      const indicator = list && list.querySelector('.nav-indicator');
      const active = list && list.querySelector('a.on');
      if (!indicator || !active) return;

      const firstTime = !list.classList.contains('js-ind');
      if (firstTime) indicator.style.transition = 'none';
      indicator.style.width = active.offsetWidth + 'px';
      indicator.style.height = active.offsetHeight + 'px';
      indicator.style.transform = `translate(${active.offsetLeft}px, ${active.offsetTop}px)`;
      if (firstTime) {
        list.classList.add('js-ind');
        void indicator.offsetWidth;
        indicator.style.transition = '';
      }

      const nav = list.parentElement;
      if (nav && nav.scrollWidth > nav.clientWidth + 2) {
        nav.scrollTo({ left: Math.max(0, active.offsetLeft - 24), behavior: 'smooth' });
      }
    }
    window.addEventListener('resize', placeNavIndicator);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeNavIndicator);

    function animateKpis(scope) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      scope.querySelectorAll('.cards .card h3').forEach((el, index) => {
        const original = el.textContent;
        const trimmed = original.trim();
        const isMoney = /^R\$/.test(trimmed);
        if (!isMoney && !/^\d+$/.test(trimmed)) return;
        const target = parseFloat(trimmed.replace(/[^\d,-]/g, '').replace(',', '.'));
        if (!isFinite(target) || target <= 0) return;

        const format = value => isMoney ? formatCurrency(value) : String(Math.round(value));
        const startAt = performance.now() + 120 + index * 45;
        const duration = 900;
        el.textContent = format(0);

        const tick = now => {
          if (!el.isConnected) return;
          const t = Math.min(1, Math.max(0, (now - startAt) / duration));
          if (t >= 1) { el.textContent = original; return; }
          el.textContent = format(target * (1 - Math.pow(1 - t, 4)));
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }

    document.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.matches &&
          event.target.matches('nav a, .pill-item, .brand-area .logo')) {
        event.preventDefault();
        event.target.click();
      }
    });

    (async () => {
      let syncLocalToServer = false;
      let servidorFalhou = false;
      try {
        const res = await fetch('/api/db');
        if (res.ok) {
          database = await res.json();
        } else {
          servidorFalhou = true;
          console.error('GET /api/db falhou com status ' + res.status);
        }
      } catch (e) { servidorFalhou = true; }

      {
        let local = null;
        try {
          const raw = localStorage.getItem('marketlandia_db');
          const parsed = raw ? JSON.parse(raw) : null;
          if (parsed && Array.isArray(parsed.users)) local = parsed;
        } catch (err) {}
        const semServidor = !database || !Array.isArray(database.users);
        const servidorSemLogins = !semServidor && database.users.length === 0;
        const localMaisNovo = local && (!Number.isInteger(local._rev) || local._rev > ((database && database._rev) || 0));
        if (local && (semServidor || (servidorSemLogins && local.users.length > 0 && localMaisNovo))) {
          database = local;
          syncLocalToServer = true;
        }
      }

      if (!database || !Array.isArray(database.users)) {
        database = {
          seq: { o: 100, p: 2180, f: 500 },
          users: [],
          cli: [],
          prod: [],
          orc: [],
          ped: [],
          fat: [],
          com: [],
          rec: [],
          audit: [],
          cfg: { liberaApos: 1, maxDesc: 10, maxPreco: 10 }
        };
      }

      if (Array.isArray(database.prod)) {
        const beforeLen = database.prod.length;
        database.prod = database.prod.filter(isProductActive);
        if (database.prod.length !== beforeLen) {
          await saveData();
        }
      }

      if (syncLocalToServer) {
        await saveData();
      }

      restoreSession();
      renderApp();
      if (sessionExpiredOnLoad) showToast('Por segurança, o login vale por 24 horas. Entre novamente.');
      if (servidorFalhou) showServerBanner(AVISO_SERVIDOR);
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
