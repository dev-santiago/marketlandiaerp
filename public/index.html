                isManager() ? formatCurrency(p.custo) : '—',
                isManager() ? costAverageCell(p) : '—',
                isManager()
                  ? `<input type="number" class="price-inline" step="any" min="0.01" value="${Math.round((Number(p.preco) || 0) * 10000) / 10000}" title="Digite o novo preço e pressione Enter (ou saia do campo) para salvar" aria-label="Preço de venda de ${escapeHtml(p.sku)}" onchange="updateProductPriceInline('${p.id}', this.value)" onkeydown="if(event.key==='Enter')this.blur()">`
                  : `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(p.preco)}</b>`,
                isManager() ? `${margin}%` : '—',
                p.est == null ? '<span class="mut">SERVIÇO</span>' : p.est > 0 ? `<span class="dot-ok">${p.est} ${escapeHtml(p.un)}</span>` : `<span class="dot-bad">${p.est} ${escapeHtml(p.un)}</span>`,
                isManager()
                  ? `<div style="display:flex;gap:6px;align-items:center">
                      <button class="secondary" style="padding:5px 9px;font-size:12px" onclick="openProductForm('${p.id}')" title="Editar Produto">${icon('edit')} Editar</button>
                      <button class="danger-outline" style="padding:5px 10px;font-size:12px" onclick="confirmDeleteProduct('${p.id}')" title="Excluir Produto do Sistema">${icon('trash')} Excluir</button>
                    </div>`
                  : '—'
              ];
            })
          );
      },

      orc() {
        return renderHeader('VENDAS', 'ORÇAMENTOS', 'openQuoteForm()') + pdfImportBar('orc') +
          renderTable(['ORÇAMENTO', 'DATA', 'CLIENTE', 'ITENS (CÓD. / METROS / UN)', 'VENDEDOR', 'VALOR', 'STATUS', 'AÇÕES'],
            filterByOwnership(database.orc).slice().reverse().map(o => [
              `<span class="num-serif">${o.n}</span><span class="sub-status">${escapeHtml(o.st)}</span>`,
              formatDate(o.data),
              `<b>${getEntityName('cli', o.cli).toUpperCase()}</b>`,
              `<small>${o.itens.map(i => {
                const pr = database.prod.find(x => x.id === i.p);
                return pr ? `<b>${escapeHtml(pr.sku)}</b> (${formatNumber(i.q, i.q % 1 === 0 ? 0 : 2)} ${escapeHtml(pr.un || 'UN')})` : `${i.q}x`;
              }).join(', ')}</small>`,
              `<b>${getSellerDisplayName(o)}</b>`,
              `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(calculateOrderTotal(o))}</b>`,
              o.ped ? '<span class="dot-ok">CONVERTIDO</span>' : `<select onchange="updateQuoteStatus('${o.id}', this.value)">${STATUS_LIST.map(s => `<option${s === o.st ? ' selected' : ''}>${s}</option>`).join('')}</select>`,
              `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                <button class="secondary" style="padding:5px 10px;font-size:12px" onclick="openPrintPreview('orc', '${o.id}')" title="Imprimir no modelo Cabolândia">${icon('printer')} Imprimir</button>
                ${!o.ped ? `<button style="padding:5px 10px;font-size:12px" onclick="convertToOrder('${o.id}')" title="Cria o pedido com o mesmo número deste orçamento">${icon('swap')} Virar pedido</button>` : o.ped ? `<small class="mut">Pedido #${escapeHtml((database.ped.find(p => p.id === o.ped) || {}).n)}</small>` : ''}
                <button class="danger-outline" style="padding:5px 10px;font-size:12px" onclick="confirmDeleteQuote('${o.id}')" title="Excluir Orçamento">${icon('trash')} Excluir</button>
              </div>`
            ]));
      },

      ped() {
        return renderHeader('VENDAS', 'PEDIDO', 'openQuoteForm()') + pdfImportBar('ped') +
          renderTable(['PEDIDO', 'DATAS', 'CLIENTE / VENDEDOR', 'ITENS / METRAGEM', 'VALOR', 'AÇÕES'],
            filterByOwnership(database.ped).slice().reverse().map(p => {
              const done = p.st === 'Faturado';
              return [
                `<span class="num-serif">${p.n}</span><span class="sub-status" style="color:${done ? 'var(--ok)' : 'var(--warn)'}">${done ? 'CONCLUÍDO' : escapeHtml(p.st).toUpperCase()}</span>`,
                `<small class="mut">EMITIDO EM: <b>${formatDate(p.data)}</b><br>ENTREGA: <b>${formatDate(p.dataEntrega || p.data)}</b></small>`,
                `<b>${getEntityName('cli', p.cli).toUpperCase()}</b><br><small class="mut">Vendedor: <b>${getSellerDisplayName(p)}</b></small>`,
                `<small>${p.itens.map(i => {
                  const pr = database.prod.find(x => x.id === i.p);
                  return pr ? `<b>${escapeHtml(pr.sku)}</b> — ${formatNumber(i.q, 3)} ${escapeHtml(pr.un || 'UN')}` : `${i.q}x`;
                }).join('<br>')}</small>`,
                `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(calculateOrderTotal(p))}</b><br><span class="${done ? 'dot-ok' : 'dot-warn'}">${done ? 'FATURADO' : 'PENDENTE'}</span>${orderFlowBadges(p)}`,
                `<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
                  <button style="padding:6px 11px;font-size:12px" onclick="openPrintPreview('ped', '${p.id}')" title="Imprimir Pedido de Venda">${icon('printer')} Imprimir</button>
                  <button class="secondary" style="padding:6px 10px;font-size:12px" onclick="openOrderDetails('${p.id}')" title="Abrir e Faturar Pedido">${icon('edit')} Abrir</button>
                  <button class="danger-outline" style="padding:6px 10px;font-size:12px" onclick="confirmDeleteOrder('${p.id}')" title="Excluir Pedido">${icon('trash')} Excluir</button>
                </div>`
              ];
            }));
      },

      vendas() {
        ensureSalesPeriod();
        const rows = getSalesRows();
        const total = sumCollection(rows, r => r.total);
        const liquido = sumCollection(rows, r => r.liq);
        const pedidos = new Set(rows.map(r => r.pedNum)).size;
        const withInvoice = rows.filter(r => r.inv);
        const finances = withInvoice.map(r => invoiceFinance(r.inv));
        const recebido = sumCollection(finances, x => x.pago);
        const aReceber = sumCollection(finances, x => x.saldo);
        const entregues = withInvoice.filter(r => r.inv.ent).length;

        const bySeller = new Map();
        rows.forEach(r => {
          const key = r.vend || r.vendNome;
          const cur = bySeller.get(key) || { nome: r.vendNome, qtd: 0, total: 0 };
          cur.qtd += 1;
          cur.total += r.total;
          bySeller.set(key, cur);
        });
        const sellerRows = Array.from(bySeller.values()).sort((a, b) => b.total - a.total).map(x => [
          `<b>${escapeHtml(String(x.nome || '—').toUpperCase())}</b>`,
          x.qtd,
          `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(x.total)}</b>`,
          `${formatNumber(total > 0 ? (x.total / total) * 100 : 0, 1)}%`
        ]);

        return renderHeader('RELATÓRIOS', 'RELATÓRIO DE VENDAS', '') + `
          <div class="sheet-bar">
            <div class="sheet-bar-info">
              <strong>${icon('chart')} Período: ${formatSalesDate(salesFrom)} a ${formatSalesDate(salesTo)}</strong>
              <small>Conta como venda todo pedido faturado, mesmo que ainda não tenha sido pago.</small>
            </div>
            <div class="sheet-bar-actions" style="flex-wrap:wrap">
              <label style="margin:0;font-size:12px">De:</label>
              <input type="date" value="${escapeHtml(salesFrom)}" onchange="setSalesPeriod(this.value, salesTo)" style="width:150px">
              <label style="margin:0;font-size:12px">Até:</label>
              <input type="date" value="${escapeHtml(salesTo)}" onchange="setSalesPeriod(salesFrom, this.value)" style="width:150px">
              <button class="secondary" onclick="quickSalesPeriod('hoje')">Hoje</button>
              <button class="secondary" onclick="quickSalesPeriod('mes')">Este mês</button>
              <button class="secondary" onclick="quickSalesPeriod('passado')">Mês passado</button>
              <button class="secondary" onclick="quickSalesPeriod('ano')">Este ano</button>
              <button onclick="exportSalesReport()">${icon('download')} Baixar Excel</button>
            </div>
          </div>
          <div class="cards">
            ${renderCard('Total de vendas (faturado)', formatCurrency(total), 'ok')}
            ${renderCard('Pedidos faturados', pedidos)}
            ${renderCard('Ticket médio por fatura', formatCurrency(rows.length ? total / rows.length : 0))}
            ${renderCard('Líquido dos itens', formatCurrency(liquido))}
            ${renderCard('Já recebido', formatCurrency(recebido), 'ok')}
            ${renderCard('A receber', formatCurrency(aReceber), aReceber > 0.004 ? 'bad' : '')}
            ${renderCard('Entregues', `${entregues} de ${withInvoice.length}`)}
          </div>
          ${isManager() ? `
            <h3 class="section-title">Vendas por Vendedor</h3>
            ${renderTable(['VENDEDOR', 'FATURAS', 'TOTAL VENDIDO', '% DO TOTAL'], sellerRows, true)}` : ''}
          <h3 class="section-title">Pedidos Faturados no Período (${rows.length})</h3>
          ${renderTable(['FATURA', 'PEDIDO', 'DATA', 'CLIENTE', 'VENDEDOR', 'TOTAL', 'ENTREGA', 'PAGAMENTO'],
            rows.map(r => [
              `<span class="num-serif">${escapeHtml(r.fatNum)}</span>`,
              `#${escapeHtml(r.pedNum)}`,
              formatDate(r.data),
              `<b>${getEntityName('cli', r.cli).toUpperCase()}</b>`,
              escapeHtml(r.vendNome || '—'),
              `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(r.total)}</b>`,
              r.inv ? deliveryBadge(r.inv) : '<span class="mut">—</span>',
              r.inv ? paymentBadge(r.inv) : '<span class="mut">—</span>'
            ]))}
        `;
      },

      receber() {
        const now = Date.now();
        const open = filterByOwnership(database.fat)
          .map(inv => ({ inv, fin: invoiceFinance(inv) }))
          .filter(x => x.fin.saldo > 0.004)
          .sort((a, b) => (a.fin.proxVenc || 0) - (b.fin.proxVenc || 0));

        const totalAberto = sumCollection(open, x => x.fin.saldo);
        const vencido = sumCollection(open.filter(x => x.fin.proxVenc && x.fin.proxVenc < now), x => x.fin.saldo);
        const clientTotals = new Map();
        open.forEach(x => clientTotals.set(x.inv.cli, roundMoney((clientTotals.get(x.inv.cli) || 0) + x.fin.saldo)));

        return renderHeader('FINANCEIRO', 'CONTAS A RECEBER', '') + `
          ${isManager() ? `<div class="sheet-bar">
            <div class="sheet-bar-info">
              <strong>${icon('sheet')} Importar Contas a Receber (planilha)</strong>
              <small>Lê <b>Vencimento</b>, <b>Conta</b> (Pedido Nº, forma e código), <b>Cliente</b>, <b>Valor</b> e <b>Saldo</b>. Cada parcela do cliente vira uma linha. Importar de novo <b>substitui</b> o que foi importado antes.</small>
            </div>
            <div class="sheet-bar-actions">
              <button onclick="triggerReceivableUpload()">${icon('download')} Importar Planilha (.xls / .xlsx / .csv)</button>
              ${database.rec.some(r => r.impKey) ? `<button class="danger-outline" onclick="confirmClearReceivables()">${icon('trash')} Excluir todas as contas a receber</button>` : ''}
            </div>
          </div>` : ''}
          <div class="cards">
            ${renderCard('Total a receber', formatCurrency(totalAberto))}
            ${renderCard('Pedidos não pagos', open.length)}
            ${renderCard('Com parcela vencida', open.filter(x => x.fin.proxVenc && x.fin.proxVenc < now).length, 'bad')}
            ${renderCard('Valor vencido', formatCurrency(vencido), 'bad')}
          </div>` +
          renderTable(['PEDIDO / PARCELA', 'CLIENTE / VENDEDOR', 'VENCIMENTO', 'TOTAL', 'RECEBIDO', 'SALDO', 'AÇÕES'],
            open.map(({ inv, fin }) => {
              const ped = database.ped.find(p => p.id === inv.ped);
              const late = fin.proxVenc && fin.proxVenc < now;
              const money = v => `<span style="white-space:nowrap">${formatCurrency(v)}</span>`;
              const sub = inv.imp
                ? (fin.parcelas.length === 1 ? `PARCELA ${escapeHtml(fin.parcelas[0].parc || '1/1')}` : `${fin.parcelas.length} PARCELAS`)
                : `FATURA ${escapeHtml(inv.n)}`;
              return [
                `<span class="num-serif rec-link" onclick="openClientReceivables('${inv.cli}')" title="Ver tudo que este cliente deve">#${escapeHtml(ped ? ped.n : (inv.pedNum || '—'))}</span><span class="sub-status">${sub}</span>${inv.imp ? '' : `<small class="mut" style="display:block">Faturado em ${formatDate(inv.data)}</small>${deliveryBadge(inv)}`}`,
                `<b class="rec-link" onclick="openClientReceivables('${inv.cli}')" title="Ver tudo que este cliente deve">${getEntityName('cli', inv.cli).toUpperCase()}</b><br><small class="mut">Vendedor: <b>${escapeHtml(String(ped ? getSellerDisplayName(ped) : getEntityName('users', inv.vend)))}</b></small><small class="mut" style="display:block">Deve no total: <b>${formatCurrency(clientTotals.get(inv.cli) || 0)}</b></small>`,
                fin.proxVenc ? `<span style="white-space:nowrap">${formatDate(fin.proxVenc)}</span>` + (late ? '<br><span class="dot-bad">ATRASADO</span>' : '') : '—',
                money(fin.valor),
                money(fin.pago),
                `<b style="font-family:var(--font-serif);font-size:16px;white-space:nowrap">${formatCurrency(fin.saldo)}</b>`,
                invoiceActionsHtml(inv)
              ];
            })).replace('class="table-wrapper"', 'class="table-wrapper tw-compact"');
      },

      fat() {
        return renderHeader('FISCAL E COMERCIAL', 'FATURAMENTO', '') +
          renderTable(['FATURA', 'EMISSÃO', 'PEDIDO ORIGEM', 'CLIENTE', 'LÍQUIDO ITENS', 'VALOR TOTAL', 'ENTREGA', 'PAGAMENTO', 'AÇÕES'],
            filterByOwnership(database.fat).filter(f => !f.imp).slice().reverse().map(f => [
              `<span class="num-serif">${f.n}</span><span class="sub-status">FATURADO</span>`,
              formatDate(f.data),
              `#${escapeHtml((database.ped.find(p => p.id === f.ped) || {}).n)}`,
              `<b>${getEntityName('cli', f.cli).toUpperCase()}</b>`,
              formatCurrency(f.liq),
              `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(f.total)}</b>`,
              deliveryBadge(f),
              paymentBadge(f),
              invoiceActionsHtml(f)
            ]));
      },

      ganhos() {
        const [selYear, selMonth] = (selectedGanhosMonth || new Date().toISOString().slice(0, 7)).split('-').map(Number);
        const prevDate = new Date(selYear, selMonth - 2, 1);
        const prevYear = prevDate.getFullYear();
        const prevMonth = prevDate.getMonth() + 1;
        const prevMonthKey = `${prevYear}-${String(prevMonth).padStart(2, '0')}`;

        const monthNamePt = (y, m) => new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
        const getRecordYearMonth = ts => {
          if (!ts) return '';
          if (typeof ts === 'string' && /^\d{4}-\d{2}/.test(ts)) return ts.slice(0, 7);
          const d = new Date(ts);
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        };

        const allInvoices = filterByOwnership(database.fat).filter(f => !f.imp);
        const invoicedOrdersWithoutFat = filterByOwnership(database.ped).filter(p =>
          p.st === 'Faturado' && !database.fat.some(f => f.ped === p.id)
        );

        const unifiedBilled = [
          ...allInvoices.map(f => {
            const origPed = database.ped.find(p => p.id === f.ped);
            return {
              id: f.id,
              fatNum: f.n,
              pedNum: origPed ? origPed.n : '—',
              cli: f.cli,
              vend: f.vend,
              vendNome: origPed?.vendNome || getEntityName('users', f.vend),
              data: f.data,
              ym: getRecordYearMonth(f.data),
              liq: Number(f.liq) || 0,
              total: Number(f.total) || 0
            };
          }),
          ...invoicedOrdersWithoutFat.map(p => {
            const total = calculateOrderTotal(p);
            const liq = sumCollection(p.itens, i => i.q * i.pu * (1 - i.d / 100));
            return {
              id: p.id,
              fatNum: 'PED',
              pedNum: p.n,
              cli: p.cli,
              vend: p.vend,
              vendNome: getSellerDisplayName(p),
              data: p.data,
              ym: getRecordYearMonth(p.data),
              liq,
              total
            };
          })
        ];

        const currBilled = unifiedBilled.filter(x => x.ym === selectedGanhosMonth);
        const prevBilled = unifiedBilled.filter(x => x.ym === prevMonthKey);

        const currTotal = sumCollection(currBilled, x => x.total);
        const prevTotal = sumCollection(prevBilled, x => x.total);
        const currLiq = sumCollection(currBilled, x => x.liq);
        const prevLiq = sumCollection(prevBilled, x => x.liq);

        const diffVal = currTotal - prevTotal;
        const diffPct = prevTotal > 0
          ? ((currTotal - prevTotal) / prevTotal) * 100
          : (currTotal > 0 ? 100 : 0);

        const diffSign = diffVal >= 0 ? '+' : '';
        const diffClass = diffVal >= 0 ? 'ok' : 'bad';

        const sellers = database.users.filter(u => u.role === 'vendedor' || u.role === 'admin');
        const sellerComparisonRows = sellers.map(u => {
          const sCurr = sumCollection(currBilled.filter(x => x.vend === u.id), x => x.total);
          const sPrev = sumCollection(prevBilled.filter(x => x.vend === u.id), x => x.total);
          const sDiff = sCurr - sPrev;
          const sPct = sPrev > 0 ? ((sCurr - sPrev) / sPrev) * 100 : (sCurr > 0 ? 100 : 0);
          return [
            `<b>${escapeHtml(u.nome.toUpperCase())}</b> <small class="mut">(${u.role.toUpperCase()})</small>`,
            formatCurrency(sPrev),
            `<b style="font-family:var(--font-serif);font-size:16px">${formatCurrency(sCurr)}</b>`,
            `<span class="${sDiff >= 0 ? 'dot-ok' : 'dot-bad'}">${sDiff >= 0 ? '+' : ''}${formatCurrency(sDiff)} (${sDiff >= 0 ? '+' : ''}${formatNumber(sPct, 1)}%)</span>`
          ];
        });

        return renderHeader('RESULTADO MENSAL E COMPARATIVO', 'GANHOS NO MÊS', '') + `
          <div class="sheet-bar">
            <div class="sheet-bar-info">
              <strong>${icon('chart')} Competência: ${escapeHtml(monthNamePt(selYear, selMonth).toUpperCase())} vs ${escapeHtml(monthNamePt(prevYear, prevMonth).toUpperCase())}</strong>
              <small>Somatória de todos os pedidos já faturados no mês selecionado comparada automaticamente com o mês passado.</small>
            </div>
            <div class="sheet-bar-actions">
              <label style="margin:0;font-size:12px">Mês de Referência:</label>
              <input type="month" value="${escapeHtml(selectedGanhosMonth)}" onchange="selectedGanhosMonth=this.value;refreshView()" style="width:170px;font-weight:700">
              <button class="secondary" onclick="selectedGanhosMonth=new Date().toISOString().slice(0,7);refreshView()">Mês Atual</button>
            </div>
          </div>

          <div class="cards">
            ${renderCard(`Faturado no Mês (${String(selMonth).padStart(2,'0')}/${selYear})`, formatCurrency(currTotal), 'ok')}
            ${renderCard(`Faturado Mês Passado (${String(prevMonth).padStart(2,'0')}/${prevYear})`, formatCurrency(prevTotal))}
            ${renderCard('Diferença vs Mês Passado (R$)', `${diffSign}${formatCurrency(diffVal)}`, diffClass)}
            ${renderCard('Variação vs Mês Passado (%)', `${diffSign}${formatNumber(diffPct, 1)}%`, diffClass)}
            ${renderCard('Líquido Itens (Mês Atual)', formatCurrency(currLiq))}
            ${renderCard('Líquido Itens (Mês Passado)', formatCurrency(prevLiq))}
            ${renderCard('Pedidos Faturados (Mês Atual)', currBilled.length)}
            ${renderCard('Pedidos Faturados (Mês Passado)', prevBilled.length)}
          </div>

          ${isManager() ? `
            <h3 class="section-title">Comparativo por Vendedor (${String(selMonth).padStart(2,'0')}/${selYear} vs ${String(prevMonth).padStart(2,'0')}/${prevYear})</h3>
            ${renderTable(['VENDEDOR', `MÊS PASSADO (${String(prevMonth).padStart(2,'0')}/${prevYear})`, `MÊS ATUAL (${String(selMonth).padStart(2,'0')}/${selYear})`, 'COMPARATIVO / EVOLUÇÃO'], sellerComparisonRows, true)}
          ` : ''}

          <h3 class="section-title">Pedidos Faturados no Mês (${currBilled.length})</h3>
          ${renderTable(
            ['FATURA', 'PEDIDO', 'DATA FATURAMENTO', 'CLIENTE', 'VENDEDOR', 'LÍQUIDO ITENS', 'TOTAL FATURADO'],
            currBilled.slice().reverse().map(x => [
              `<span class="num-serif">${escapeHtml(x.fatNum)}</span><span class="sub-status">FATURADO</span>`,
              `#${escapeHtml(x.pedNum)}`,
              formatDate(x.data),
              `<b>${getEntityName('cli', x.cli).toUpperCase()}</b>`,
              escapeHtml(x.vendNome),
              formatCurrency(x.liq),
              `<b style="font-family:var(--font-serif);font-size:16px;color:var(--ok)">${formatCurrency(x.total)}</b>`
            ])
          )}
        `;
      },

      rec() {
        const receivables = filterByOwnership(database.rec);
        const currentTime = Date.now();
        const isPending = x => (x.valor - x.pago) > 0.004;

        return renderHeader('FINANCEIRO', 'PARCELAS E BAIXAS', '') + `
          <div class="cards">
            ${renderCard('Em aberto', formatCurrency(sumCollection(receivables, x => x.valor - x.pago)))}
            ${renderCard('Recebido', formatCurrency(sumCollection(receivables, x => x.pago)), 'ok')}
            ${renderCard('Vencido', formatCurrency(sumCollection(receivables.filter(x => x.venc < currentTime), x => x.valor - x.pago)), 'bad')}
          </div>` +
          renderTable(['FATURA', 'CLIENTE', 'PARCELA', 'VENCIMENTO', 'VALOR', 'RECEBIDO', 'SALDO', 'BAIXA'],
            receivables.map(x => [
              `<span class="num-serif">${x.n}</span>`,
              `<b>${getEntityName('cli', x.cli).toUpperCase()}</b>`,
              x.parc,
              formatDate(x.venc) + (isPending(x) && x.venc < currentTime ? '<br><span class="dot-bad">ATRASADO</span>' : ''),
              formatCurrency(x.valor),
              formatCurrency(x.pago),
              `<b>${formatCurrency(x.valor - x.pago)}</b>`,
              !isPending(x) ? '<span class="dot-ok">PAGO</span>' : isManager() ? `<div style="display:flex;gap:6px"><input id="receipt_${x.id}" type="number" step="0.01" value="${(x.valor - x.pago).toFixed(2)}" style="width:100px"> <button onclick="settleReceipt('${x.id}')">Receber</button></div>` : '<span class="dot-warn">PENDENTE</span>'
            ]));
      },

      com() {
        const commissions = filterByOwnership(database.com);
        const sumStatus = status => formatCurrency(sumCollection(commissions.filter(x => x.st === status), x => x.valor));

        return renderHeader('FINANCEIRO', 'COMISSÕES', '') + `
          <div class="cards">
            ${renderCard('Apuradas', sumStatus('Apurada'))}
            ${renderCard('Liberadas', sumStatus('Liberada'))}

    function maskCep(v) {
      const d = String(v || '').replace(/\D/g, '').slice(0, 8);
      return d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d;
    }

    async function lookupCep(cep) {
      const get = async url => {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        try {
          const r = await fetch(url, { signal: ctrl.signal });
          return r.ok ? await r.json() : null;
        } finally {
          clearTimeout(timer);
        }
      };
      try {
        const j = await get(`https://viacep.com.br/ws/${cep}/json/`);
        if (j) return j.erro ? null : { log: j.logradouro || '', bairro: j.bairro || '', cid: j.localidade || '', uf: j.uf || '' };
      } catch (e) {}
      try {
        const j = await get(`https://brasilapi.com.br/api/cep/v1/${cep}`);
        if (j && j.city) return { log: j.street || '', bairro: j.neighborhood || '', cid: j.city || '', uf: j.state || '' };
      } catch (e) {}
      return null;
    }

    let cepLookupSeq = 0;

    async function onClientCepInput(input) {
      input.value = maskCep(input.value);
      const digits = input.value.replace(/\D/g, '');
      const status = getEl('cli_zip_status');
      const seq = ++cepLookupSeq;
      if (digits.length < 8) {
        if (status) status.textContent = '';
        return;
      }
      if (status) status.textContent = 'Buscando CEP…';
      const data = await lookupCep(digits);
      if (seq !== cepLookupSeq || !getEl('cli_zip')) return;
      if (!data) {
        if (status) status.textContent = 'CEP não encontrado. Preencha o endereço manualmente.';
        return;
      }
      const fill = (id, val) => { const el = getEl(id); if (el && val) el.value = val; };
      fill('cli_address', data.log);
      fill('cli_bairro', data.bairro);
      fill('cli_city', data.cid);
      fill('cli_state', String(data.uf).toUpperCase());
      if (status) status.textContent = 'Endereço preenchido automaticamente.';
      if (document.activeElement === input) {
        const numField = getEl('cli_num');
        if (numField) numField.focus();
      }
    }

    function saveClient(editId = '') {
      const isCompany = getVal('cli_type') === 'J';
      const cleanDoc = getVal('cli_doc').replace(/\D/g, '');
      const clientName = getVal('cli_name').trim();
      const assignedSeller = isManager() ? getVal('cli_seller') : currentUser.id;
      const sellerPrintName = getVal('cli_seller_name').trim();

      if (!clientName) return showToast('Informe o nome ou a razão social');
      if (!cleanDoc) return showToast('Informe o CNPJ ou CPF do cliente');
      if (database.cli.some(c => c.doc.replace(/\D/g, '') === cleanDoc && c.id !== editId)) {
        return showToast('Já existe cliente com este documento');
      }

      const payload = {
        tipo: getVal('cli_type'),
        nome: clientName,
        doc: getVal('cli_doc').trim(),
        ie: getVal('cli_ie').trim(),
        email: getVal('cli_email').trim(),
        tel: getVal('cli_phone').trim(),
        cep: getVal('cli_zip').trim(),
        log: getVal('cli_address').trim(),
        num: getVal('cli_num').trim(),
        comp: getVal('cli_comp').trim(),
        bairro: getVal('cli_bairro').trim(),
        cid: getVal('cli_city').trim() || 'Alfenas',
        uf: (getVal('cli_state').trim() || 'MG').toUpperCase(),
        vend: assignedSeller || currentUser.id,
        vendNome: sellerPrintName
      };

      if (editId) {
        const target = database.cli.find(c => c.id === editId);
        if (target) Object.assign(target, payload);
        addAuditLog(`Cliente ${clientName} atualizado`);
      } else {
        database.cli.push({
          id: nextId(),
          ...payload,
          ativo: 1
        });
        addAuditLog(`Cliente ${clientName} criado`);
      }

      saveData();
      closeModal();
      refreshView();
      showToast(`Cliente ${clientName} salvo com sucesso!`);
    }

          <div style="display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap">
            <div style="display:flex;gap:8px">
              <button onclick="saveProduct('${existing ? existing.id : ''}')">${existing ? 'Salvar Alterações' : 'Cadastrar Produto'}</button>
              <button class="secondary" onclick="closeModal()">Cancelar</button>
            </div>
            ${existing ? `<button type="button" class="danger-outline" onclick="confirmDeleteProduct('${existing.id}')">${icon('trash')} Excluir Produto</button>` : ''}
          </div>
        </div>`);
    }

    function saveProduct(editId = '') {
      if (!isManager()) return;
      const sku = getVal('prod_sku').trim().toUpperCase();
      const codInt = getVal('prod_codint').trim();
      const name = getVal('prod_name').trim();
      const ativoStr = getVal('prod_ativo');
      const ativoFlag = parseAtivoSimNao(ativoStr);
      const salePrice = Number(getVal('prod_price'));
      const costPrice = Number(getVal('prod_cost')) || 0;
      const stockInput = getVal('prod_stock');
      const cat = getVal('prod_cat').trim() || 'GERAL';
      const marca = getVal('prod_marca').trim() || 'CABEL AUTO';

      if (!sku || !name || !(salePrice > 0)) {
        return showToast('Informe o Código (ex: VM250100), a Descrição do Cabo e o Preço de Venda.');
      }

      if (ativoFlag === 0) {
        if (editId) {
          database.prod = database.prod.filter(p => p.id !== editId);
          addAuditLog(`Produto ${sku} marcado como inativo e removido do sistema`);
          saveData();
          closeModal();
          refreshView();
          return showToast(`Produto ${sku} marcado como Não Ativo e removido do sistema.`);
        } else {
          closeModal();
          return showToast(`Produto ${sku} está marcado como Não Ativo e não foi incluído no sistema.`);
        }
      }

      const duplicate = database.prod.find(p => p.sku.toUpperCase() === sku && p.id !== editId);
      if (duplicate) {
        return showToast(`O código ${sku} já está cadastrado para "${duplicate.nome}".`);
      }

      if (editId) {
        const target = database.prod.find(p => p.id === editId);
        if (!target) return;
        target.sku = sku;
        target.codInt = codInt;
        target.nome = name;
        target.ativo = 1;
        target.un = getVal('prod_unit');
        recordCost(target, costPrice, 'Edição manual');
        target.preco = salePrice;
        target.est = stockInput === '' ? null : Number(stockInput);
        target.cat = cat;
        target.marca = marca;
        addAuditLog(`Produto ${sku} (${name}) atualizado`);
      } else {
        database.prod.push({
          id: nextId(),
          codInt,
          sku,
          nome: name,
          ativo: 1,
          un: getVal('prod_unit'),
          custo: costPrice,
          preco: salePrice,
          est: stockInput === '' ? null : Number(stockInput),
          cat,
          marca
        });
        addAuditLog(`Produto ${sku} (${name}) criado`);
      }

      saveData();
      closeModal();
      refreshView();
      showToast(`Produto ${sku} salvo com sucesso!`);
    }

    function updateProductPriceInline(prodId, raw) {
      if (!isManager()) return;
      const prod = database.prod.find(p => p.id === prodId);
      if (!prod) return;
      const value = Number(String(raw).trim().replace(',', '.'));
      if (!isFinite(value) || value <= 0) {
        showToast('Informe um preço de venda maior que zero.');
        return refreshView();
      }
      const novo = Math.round(value * 10000) / 10000;
      const antigo = Number(prod.preco) || 0;
      if (Math.abs(novo - antigo) < 0.00005) return refreshView();
      prod.preco = novo;
      addAuditLog(`Preço de venda de ${prod.sku} alterado manualmente: ${formatCurrency(antigo)} → ${formatCurrency(novo)}`);
      saveData();
      refreshView();
      showToast(`Preço de ${prod.sku} atualizado para ${formatCurrency(novo)}.`);
    }

    function confirmDeleteProduct(prodId) {
      if (!isManager()) return;
      const product = database.prod.find(p => p.id === prodId);
      if (!product) return;

      openModal(`
        <h3>Excluir Produto do Sistema</h3>
        <p style="font-size:14px;line-height:1.6">

        <div style="background:#fdebec;border:1px solid rgba(217,30,54,0.3);padding:12px 14px;border-radius:6px;margin:14px 0">

        <div style="display:flex;gap:10px;margin-top:18px">

    async function deleteProduct(prodId) {
      if (!isManager()) return;
      const idx = database.prod.findIndex(p => p.id === prodId);
      if (idx === -1) return closeModal();

      const removed = database.prod[idx];
      database.prod.splice(idx, 1);
      addAuditLog(`Produto excluído: ${removed.sku} — ${removed.nome}`);
      await saveData();
      closeModal();
      refreshView();
      showToast(`Produto ${removed.sku} excluído do sistema!`);
    }

    function confirmRemoveInactiveProducts() {
      if (!isManager()) return;
      const inactives = database.prod.filter(p => !isProductActive(p));
      if (!inactives.length) return showToast('Não há produtos inativos no sistema.');

      openModal(`
        <h3>Excluir Produtos Inativos (${inactives.length})</h3>
        <p>Deseja remover do sistema todos os <b>${inactives.length}</b> produtos que estão marcados como inativos?</p>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button onclick="removeInactiveProducts()">${icon('ban')} Remover Inativos Agora</button>
          <button class="secondary" onclick="closeModal()">Cancelar</button>
        </div>

    async function removeInactiveProducts() {
      const beforeCount = database.prod.length;
      database.prod = database.prod.filter(isProductActive);
      const removedCount = beforeCount - database.prod.length;
      addAuditLog(`${removedCount} produto(s) inativo(s) removido(s) do catálogo`);
      await saveData();
      prodStatusFilter = 'ALL';
      closeModal();
      refreshView();
      showToast(`${removedCount} produto(s) inativo(s) excluído(s) do sistema!`);
    }

    function unusedClientIds() {
      const used = new Set();
      [database.orc, database.ped, database.fat, database.rec].forEach(list => (list || []).forEach(x => { if (x && x.cli) used.add(x.cli); }));
      return database.cli.filter(c => !used.has(c.id)).map(c => c.id);
    }

    function confirmClearUnusedClients() {
      if (!isManager()) return;
      const ids = unusedClientIds();
      const kept = database.cli.length - ids.length;
      openModal(`
        <h3>Excluir clientes sem movimentação</h3>
        <p>Serão excluídos <b>${ids.length} cliente(s)</b> que não têm nenhum orçamento, pedido, fatura ou conta a receber.</p>
        <p class="mut" style="font-size:12px">${kept} cliente(s) com histórico serão mantidos. Depois você pode importar sua planilha de clientes a qualquer momento.</p>
        <div style="display:flex;gap:10px;margin-top:18px">
          <button onclick="clearUnusedClients()">${icon('trash')} Sim, Excluir ${ids.length} Cliente(s)</button>
          <button class="secondary" onclick="closeModal()">Cancelar</button>

    async function clearUnusedClients() {
      if (!isManager()) return;
      const ids = new Set(unusedClientIds());
      const count = ids.size;
      database.cli = database.cli.filter(c => !ids.has(c.id));
      addAuditLog(`Clientes sem movimentação excluídos (${count})`);

      refreshView();
      showToast(`${count} cliente(s) sem movimentação excluído(s).`);

    function confirmClearAllProducts() {
      if (!isManager()) return;
      openModal(`
        <h3>Limpar Todo o Catálogo de Produtos</h3>
        <p>Tem certeza que deseja excluir <b>todos os ${database.prod.length} produtos</b> cadastrados no catálogo?</p>
        <p class="mut" style="font-size:12px">Você poderá importar novamente sua planilha Excel (.xlsx / .csv) a qualquer momento.</p>
        <div style="display:flex;gap:10px;margin-top:18px">

    function confirmDeleteQuote(quoteId) {
      const quote = database.orc.find(o => o.id === quoteId);
      if (!quote) return;
      if (!isManager() && quote.vend !== currentUser.id) return showToast('Só o vendedor responsável ou um gerente pode alterar este registro.');

    async function deleteQuote(quoteId) {
      const idx = database.orc.findIndex(o => o.id === quoteId);
      if (idx === -1) return closeModal();
      const quote = database.orc[idx];
      if (!isManager() && quote.vend !== currentUser.id) return closeModal();

      database.ped.forEach(p => {
        if (p.orc === quote.id) p.orc = null;
      });

      database.orc.splice(idx, 1);
      addAuditLog(`Orçamento #${quote.n} excluído`);
      await saveData();
      closeModal();
      refreshView();
      showToast(`Orçamento #${quote.n} excluído com sucesso!`);

    function confirmDeleteOrder(orderId) {
      const order = database.ped.find(p => p.id === orderId);
      if (!order) return;
      if (!isManager() && order.vend !== currentUser.id) return showToast('Só o vendedor responsável ou um gerente pode alterar este registro.');

      const hasInvoiced = order.itens.some(i => i.fat > 0);

      openModal(`
        <h3>Excluir Pedido #${escapeHtml(order.n)}</h3>
        <p style="font-size:14px;line-height:1.6">
          Tem certeza que deseja excluir o pedido <b>#${escapeHtml(order.n)}</b> do cliente <b>${getEntityName('cli', order.cli)}</b> no valor de <b>${formatCurrency(calculateOrderTotal(order))}</b>?
        </p>
        ${hasInvoiced ? `<p class="mut" style="font-size:12px">Nota: As quantidades faturadas deste pedido serão estornadas automaticamente para o estoque e os lançamentos financeiros/faturas vinculados a ele serão removidos.</p>` : ''}
        <div style="display:flex;gap:10px;margin-top:18px">
          <button onclick="deleteOrder('${order.id}')">${icon('trash')} Confirmar Exclusão do Pedido</button>
          <button class="secondary" onclick="closeModal()">Cancelar</button>
        </div>
      `);
    }

    async function deleteOrder(orderId) {
      const idx = database.ped.findIndex(p => p.id === orderId);
      if (idx === -1) return closeModal();
      const order = database.ped[idx];
      if (!isManager() && order.vend !== currentUser.id) return closeModal();

      if (order.orc) {
        const originQuote = database.orc.find(o => o.id === order.orc || o.ped === order.id);
        if (originQuote) {
          originQuote.ped = null;
          if (originQuote.st === 'Convertido em pedido') {
            originQuote.st = 'Aprovado pelo cliente';
          }
          if (Array.isArray(originQuote.hist)) {
            originQuote.hist.push([Date.now(), currentUser.nome, `Pedido #${order.n} excluído`]);
          }
        }
      }

      order.itens.forEach(item => {
        if (item.fat > 0) {
          const prod = database.prod.find(p => p.id === item.p);
          if (prod && prod.est != null) {
            prod.est += Number(item.fat) || 0;
          }
        }
      });

      const invoiceIds = database.fat.filter(f => f.ped === order.id).map(f => f.id);
      if (invoiceIds.length > 0) {
        database.fat = database.fat.filter(f => f.ped !== order.id);
        database.rec = database.rec.filter(r => !invoiceIds.includes(r.fat));
        database.com = database.com.filter(c => !invoiceIds.includes(c.fat) && c.ped !== order.n);
      }

      database.ped.splice(idx, 1);
      addAuditLog(`Pedido #${order.n} excluído`);
      await saveData();
      closeModal();
      refreshView();
      showToast(`Pedido #${order.n} excluído com sucesso!`);
    }

    function openQuoteForm() {
      draftOrder = {
        itens: [],
        cli: '',
        vendNome: currentUser?.nome || 'Thiago',
        frete: 0,
        outros: 0,
        parc: 1,
        formaPag: 'CHEQUE',
        condPag: '30 Dias',
        dataEntrega: todayIso(),
        obs: '',
        codeInput: ''
      };
      lookedUpProduct = null;
      renderQuoteModal();
    }

    let cliComboResults = [];
    let cliComboActive = 0;

    function cliComboLabel(c) { return c ? `${c.nome} (${c.doc})` : ''; }

    function cliComboSummary(c) {
      if (!c) return '';
      const parts = [c.doc, c.cid ? `${c.cid}/${c.uf || ''}` : '', c.tel].filter(Boolean);
      return escapeHtml(parts.join(' · '));
    }

    function cliComboSelected() {
      const id = getVal('quote_cli');
      return database.cli.find(c => c.id === id);
    }

    function cliComboFocus(input) {
      cliComboRender('');
      input.select();
    }

    function cliComboClick(input) {
      const list = getEl('quote_cli_list');
      if (list && list.hidden) cliComboFocus(input);
    }

    function cliComboRender(query) {
      const list = getEl('quote_cli_list');
      if (!list) return;
      const all = searchClients(database.cli.filter(c => c.ativo), query);
      const terms = clientSearchTerms(query);
      cliComboResults = all.slice(0, 30);
      cliComboActive = 0;
      list.innerHTML = cliComboResults.length
        ? cliComboResults.map((c, i) => `
            <div class="cli-combo-item ${i === 0 ? 'act' : ''}" role="option" id="quote_cli_opt_${i}" onmousedown="event.preventDefault();cliComboPick(${i})" onmousemove="cliComboHover(${i})">
              <b>${hlText(c.nome, terms)}</b>
              <small>${hlText(c.doc || '—', terms)}${c.codSis ? ` · cód ${hlText(c.codSis, terms)}` : ''}${c.cid ? ` · ${hlText(c.cid, terms)}/${escapeHtml(c.uf || '')}` : ''}${c.tel ? ` · ${hlText(c.tel, terms)}` : ''}</small>
            </div>`).join('') +
          `<div class="cli-combo-foot">${all.length > 30 ? `Mostrando 30 de ${all.length} — continue digitando para refinar.` : `${all.length} ${all.length === 1 ? 'cliente' : 'clientes'}`}</div>`
        : `<div class="cli-combo-foot">Nenhum cliente ativo encontrado para “${escapeHtml(query)}”.</div>`;
      list.hidden = false;
      const input = getEl('quote_cli_search');
      if (input) input.setAttribute('aria-expanded', 'true');
    }

    function cliComboHover(i) {
      if (i === cliComboActive) return;
      cliComboSetActive(i, false);
    }

    function cliComboSetActive(i, scroll = true) {
      const items = document.querySelectorAll('#quote_cli_list .cli-combo-item');
      if (!items.length) return;
      cliComboActive = Math.max(0, Math.min(items.length - 1, i));
      items.forEach((el, idx) => el.classList.toggle('act', idx === cliComboActive));
      if (scroll) items[cliComboActive].scrollIntoView({ block: 'nearest' });
    }

    function cliComboClose() {
      const list = getEl('quote_cli_list');
      if (list) list.hidden = true;
      const input = getEl('quote_cli_search');
      if (input) input.setAttribute('aria-expanded', 'false');
    }

    function cliComboBlur() {
      cliComboClose();
      const input = getEl('quote_cli_search');
      if (input) input.value = cliComboLabel(cliComboSelected());
    }

    function cliComboKey(event) {
      const list = getEl('quote_cli_list');
      const open = list && !list.hidden;
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        if (!open) {
          const field = getEl('quote_cli_search');
          cliComboRender(field.value === cliComboLabel(cliComboSelected()) ? '' : field.value);
          field.select();
          return;
        }
        cliComboSetActive(cliComboActive + (event.key === 'ArrowDown' ? 1 : -1));
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (open && cliComboResults.length) cliComboPick(cliComboActive);
      } else if (event.key === 'Escape' && open) {
        event.preventDefault();
        cliComboBlur();
      }
    }

    function cliComboPick(i) {
      const c = cliComboResults[i];
      if (!c) return;
      getEl('quote_cli').value = c.id;
      getEl('quote_cli_search').value = cliComboLabel(c);
      getEl('quote_cli_sel').innerHTML = cliComboSummary(c);
      cliComboClose();
      syncDraftValues();
      if (c.vendNome && getEl('quote_seller_name') && database.users.some(u => u.ativo && u.nome === c.vendNome)) {
        getEl('quote_seller_name').value = c.vendNome;
        draftOrder.vendNome = c.vendNome;
      }
    }

    function syncDraftValues() {
      if (getEl('quote_cli')) draftOrder.cli = getVal('quote_cli');
      if (getEl('quote_seller_name')) draftOrder.vendNome = getVal('quote_seller_name');
      if (getEl('quote_freight')) draftOrder.frete = Number(getVal('quote_freight')) || 0;
      if (getEl('quote_others')) draftOrder.outros = Number(getVal('quote_others')) || 0;
      if (getEl('quote_installments')) draftOrder.parc = Number(getVal('quote_installments')) || 1;
      if (getEl('quote_pay_method')) draftOrder.formaPag = getVal('quote_pay_method');
      if (getEl('quote_pay_terms')) draftOrder.condPag = getVal('quote_pay_terms');
      if (getEl('quote_delivery_date')) draftOrder.dataEntrega = getVal('quote_delivery_date');
      if (getEl('quote_obs')) draftOrder.obs = getVal('quote_obs');
      if (getEl('quote_code_input')) draftOrder.codeInput = getVal('quote_code_input');
    }

    function onCodeInputLookup(rawCode) {
      draftOrder.codeInput = rawCode;
      const cleanCode = String(rawCode || '').trim().toUpperCase();
      const statusEl = getEl('code_lookup_status');
      const selectEl = getEl('quote_item');

      if (!cleanCode) {
        lookedUpProduct = null;
        if (statusEl) {
          statusEl.className = 'code-preview-status code-preview-empty';
          statusEl.innerHTML = `<span>Digite um código da planilha (ex: <b>VM250100</b> ou <b>BR100100</b>) para buscar a descrição do cabo.</span>`;
        }
        return;
      }

      let match = database.prod.find(p => p.sku.toUpperCase() === cleanCode || (p.codInt && String(p.codInt).toUpperCase() === cleanCode));
      if (!match) {
        const partials = database.prod.filter(p => p.sku.toUpperCase().startsWith(cleanCode));
        if (partials.length === 1) match = partials[0];
      }

      lookedUpProduct = match || null;

      if (!match) {
        if (statusEl) {
          statusEl.className = 'code-preview-status code-preview-empty';
          statusEl.innerHTML = `<span>Nenhum produto ativo encontrado no sistema com o código <b>${escapeHtml(cleanCode)}</b>.</span>`;
        }
        return;
      }

      const active = isProductActive(match);
      if (selectEl && active) {
        selectEl.value = match.id;
      }

      if (statusEl) {
        if (active) {
          statusEl.className = 'code-preview-status code-preview-ok';
          statusEl.innerHTML = `
            <div>
              <span class="badge-sim">ATIVO: SIM</span>
              <span class="sku-pill" style="margin-left:8px">${escapeHtml(match.sku)}</span> <b>${escapeHtml(match.nome)}</b>
              <div style="font-size:12px;margin-top:3px">Unidade: <b>${escapeHtml(match.un)}</b> · Estoque: <b>${match.est ?? '—'}</b> · Preço Unitário: <b>${formatCurrency(match.preco)}</b></div>
            </div>
            <button type="button" onclick="addQuoteItemByLookup()">+ Incluir ${escapeHtml(match.sku)}</button>
          `;
        } else {
          statusEl.className = 'code-preview-status code-preview-inactive';
          statusEl.innerHTML = `
            <div>
              <span class="badge-nao">ATIVO: NÃO (BLOQUEADO)</span>
              <span class="sku-pill" style="margin-left:8px">${escapeHtml(match.sku)}</span> <b>${escapeHtml(match.nome)}</b>
              <div style="font-size:12px;margin-top:3px">Este produto consta como inativo e não pode ser incluído no pedido/orçamento.</div>
            </div>
          `;
        }
      }
    }

    function addQuoteItemByLookup() {
      if (!lookedUpProduct) {
        return showToast('Digite um código válido (ex: VM250100) primeiro.');
      }
      if (!isProductActive(lookedUpProduct)) {
        return showToast(`O produto ${lookedUpProduct.sku} (${lookedUpProduct.nome}) está INATIVO e não pode ser incluído!`);
      }
      syncDraftValues();
      const quantity = Number(getVal('quote_qty')) || 1;
      const discount = Number(getVal('quote_discount')) || 0;

      if (!(quantity > 0) || discount < 0 || discount > 100) {
        return showToast('Informe quantidade maior que zero e desconto entre 0 e 100%');
      }

      draftOrder.itens.push({ p: lookedUpProduct.id, q: quantity, pu: lookedUpProduct.preco, d: discount });
      draftOrder.codeInput = '';
      lookedUpProduct = null;
      renderQuoteModal();
      showToast('Cabo adicionado ao orçamento!');
    }

    function applyQuoteMarkup() {
      syncDraftValues();
      if (!draftOrder.itens.length) return showToast('Adicione ao menos um cabo ao pedido.');
      const pct = Number(String(getVal('quote_markup')).trim().replace(',', '.'));
      if (!isFinite(pct) || pct === 0 || pct <= -100) return showToast('Informe uma porcentagem válida (ex: 8).');
      if (pct < 0 && currentUser.role === 'vendedor') return showToast('Vendedor só pode aplicar acréscimo.');
      const markedPrice = item => Math.round(item.pu * (1 + pct / 100) * 10000) / 10000;
      if (!isAdmin()) {
        const blocked = draftOrder.itens.find(i => !checkPriceLock(i.p, markedPrice(i)).ok);
        if (blocked) return showToast(checkPriceLock(blocked.p, markedPrice(blocked)).msg);
      }

      draftOrder.markupBackup = { pct, list: draftOrder.itens.map(i => ({ i, pu: i.pu })) };
      draftOrder.itens.forEach(i => {
        i.pu = Math.round(i.pu * (1 + pct / 100) * 10000) / 10000;
      });
      renderQuoteModal();
      showToast(`${pct > 0 ? '+' : ''}${formatNumber(pct, 2)}% aplicado no valor de ${draftOrder.itens.length} item(ns).`);
    }

    function undoQuoteMarkup() {
      if (!draftOrder?.markupBackup) return;
      syncDraftValues();
      draftOrder.markupBackup.list.forEach(x => {
        x.i.pu = x.pu;
      });
      draftOrder.markupBackup = null;
      renderQuoteModal();
      showToast('Acréscimo desfeito.');
    }

    function renderQuoteModal() {
      const availableClients = database.cli.filter(c => c.ativo);
      const activeProducts = database.prod.filter(isProductActive);
      const paymentMethods = ['CHEQUE', 'BOLETO', 'PIX', 'DINHEIRO', 'CARTÃO DE CRÉDITO', 'CARTÃO DE DÉBITO', 'A PRAZO / CARTEIRA', 'TRANSFERÊNCIA'];

      openModal(`
        <h3>Novo Orçamento / Pedido de Venda</h3>
        <div class="form-layout">
          <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:10px">
            <div>
              <label>Cliente *</label>
              ${(() => {
                  const selected = availableClients.find(c => c.id === draftOrder.cli);
                  if (!availableClients.length) {
                    return `<input type="hidden" id="quote_cli" value=""><input type="text" disabled placeholder="— Cadastre um cliente no menu Clientes primeiro —">`;
                  }
                  return `
                    <div class="cli-combo">
                      <input type="hidden" id="quote_cli" value="${escapeHtml(selected ? selected.id : '')}">
                      <input type="text" id="quote_cli_search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="quote_cli_list" aria-autocomplete="list"
                        placeholder="Digite nome, CNPJ/CPF, código ou cidade…"
                        value="${escapeHtml(cliComboLabel(selected))}"
                        onfocus="cliComboFocus(this)" onclick="cliComboClick(this)" oninput="cliComboRender(this.value)" onkeydown="cliComboKey(event)" onblur="cliComboBlur()">
                      <div class="cli-combo-list" id="quote_cli_list" role="listbox" hidden onmousedown="event.preventDefault()"></div>
                      <div class="cli-combo-sel" id="quote_cli_sel">${cliComboSummary(selected)}</div>
                    </div>`;
                })()}
            </div>
            <div>
              <label>Quem Vendeu (Vendedor no Pedido) *</label>
              <select id="quote_seller_name" onchange="syncDraftValues()">${sellerSelectOptions(draftOrder.vendNome)}</select>
            </div>
          </div>

          <div class="code-lookup-box">
            <label style="margin-top:0;color:var(--pri)">1. Digitar Código do Cabo / Produto (Ex: PT500MT ou VM250100)</label>
            <div style="display:grid;grid-template-columns:1.4fr 1.6fr;gap:10px;align-items:end">
              <div>
                <input id="quote_code_input" list="sku_datalist" placeholder="Ex: PT500MT ou VM250100" value="${escapeHtml(draftOrder.codeInput || '')}" oninput="onCodeInputLookup(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();addQuoteItemByLookup();}" style="font-weight:700;text-transform:uppercase">
                <datalist id="sku_datalist">
                  ${activeProducts.map(p => `<option value="${escapeHtml(p.sku)}">${escapeHtml(p.nome)} (${escapeHtml(p.un)}) — ${formatCurrency(p.preco)}</option>`).join('')}
                </datalist>
              </div>
              <div>
                <select id="quote_item" onchange="const pr=database.prod.find(x=>x.id===this.value);if(pr){getEl('quote_code_input').value=pr.sku;onCodeInputLookup(pr.sku);}">
                  <option value="">— Ou selecione o cabo pela descrição (${activeProducts.length} ativos) —</option>
                  ${activeProducts.map(p => `<option value="${p.id}">[${escapeHtml(p.sku)}] ${escapeHtml(p.nome)} (${escapeHtml(p.un)}) — ${formatCurrency(p.preco)}</option>`).join('')}
                </select>
              </div>
            </div>

            <div id="code_lookup_status" class="code-preview-status code-preview-empty">
              <span>Digite um código da planilha (ex: <b>PT500MT</b> ou <b>VM250100</b>) para ler a descrição do cabo.</span>
            </div>

            <div style="display:flex;gap:8px;align-items:end;margin-top:10px;flex-wrap:wrap">
              <div><label style="margin:0">Qtd / Nº de Metros ou Unid.</label><input id="quote_qty" type="number" step="0.001" value="1" min="0.001" style="width:140px"></div>
              <div><label style="margin:0">Desc. %</label><input id="quote_discount" type="number" step="0.1" value="0" min="0" style="width:90px"></div>
              <button type="button" onclick="addQuoteItem()">+ Adicionar Item ao Pedido</button>
            </div>
          </div>

          ${renderTable(['Referência', 'Descrição do Cabo / Produto', 'Unid.', 'Qtd / Metros', 'Unitário', 'Desc.', 'Total', ''], draftOrder.itens.map((i, idx) => {
            const pr = database.prod.find(x => x.id === i.p);
            const discVal = i.q * i.pu * (i.d / 100);
            return [
              `<span class="sku-pill">${escapeHtml(pr?.sku || '—')}</span>`,
              `<b>${escapeHtml(pr?.nome || '—')}</b>`,
              escapeHtml(pr?.un || 'UN'),
              `<input type="number" step="0.001" min="0.001" style="width:104px" value="${i.q}" title="Altere a quantidade deste item" onchange="setQuoteItemQty(${idx}, this.value)">`,
              (() => {
                const base = Number(pr?.preco) || 0;
                const changed = base > 0 && Math.abs(i.pu - base) > 0.00005;
                const diff = base > 0 ? (i.pu / base - 1) * 100 : 0;
                return `<input type="number" step="any" min="0.01" style="width:112px" value="${Math.round(i.pu * 10000) / 10000}" title="Altere o preço unitário deste item${isAdmin() ? '' : ` (limite de ±${formatNumber(priceLockPct(), 1)}% sobre o catálogo)`}" onchange="setQuoteItemPrice(${idx}, this.value)">${changed ? `<br><small class="mut">Catálogo ${formatCurrency(base)} (${diff > 0 ? '+' : ''}${formatNumber(diff, 2)}%)</small>` : ''}`;
              })(),
              `<input type="number" step="0.1" min="0" max="100" style="width:70px" value="${i.d}" title="Desconto em % neste item" onchange="setQuoteItemDiscount(${idx}, this.value)"> %<br><small class="mut">${formatCurrency(discVal)}</small>`,
              `<b>${formatCurrency(i.q * i.pu * (1 - i.d / 100))}</b>`,
              `<button class="secondary" style="padding:4px 8px;font-size:11px" onclick="draftOrder.itens.splice(${idx},1);renderQuoteModal()">${icon('x')}</button>`
            ];
          }), true)}

          ${draftOrder.itens.length ? `
            <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:6px 0 14px">
              <div>
                <label style="margin:0">Acrescentar % no valor de cada cabo</label>
                <input id="quote_markup" type="text" inputmode="decimal" placeholder="Ex: 8" style="width:130px" onkeydown="if(event.key==='Enter'){event.preventDefault();applyQuoteMarkup()}">
              </div>
              <button type="button" class="secondary" onclick="applyQuoteMarkup()">Aplicar %</button>
              ${draftOrder.markupBackup ? `<button type="button" class="secondary" onclick="undoQuoteMarkup()">Desfazer último (${formatNumber(draftOrder.markupBackup.pct, 2)}%)</button>` : ''}
            </div>` : ''}

          <div style="display:grid;grid-template-columns:1.2fr 1fr 0.8fr 1fr;gap:10px">
            <div>
              <label>Forma de Pagamento</label>
              <select id="quote_pay_method" onchange="syncDraftValues()">
                ${paymentMethods.map(m => `<option value="${m}" ${m === draftOrder.formaPag ? 'selected' : ''}>${m}</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Condição / Prazo</label>
              <select id="quote_pay_terms" onchange="syncDraftValues()">${termOptionsHtml(draftOrder.condPag)}</select>
            </div>
            <div>
              <label>Parcelas</label>
              <select id="quote_installments" onchange="syncDraftValues()">
                ${[1, 2, 3, 4, 5, 6, 8, 10, 12].map(n => `<option value="${n}" ${n === draftOrder.parc ? 'selected' : ''}>${String(n).padStart(2, '0')}x</option>`).join('')}
              </select>
            </div>
            <div>
              <label>Data de Entrega</label>
              <input id="quote_delivery_date" type="date" value="${escapeHtml(draftOrder.dataEntrega || todayIso())}" onchange="syncDraftValues()">
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px">
            <div><label>Frete (R$)</label><input id="quote_freight" type="number" step="0.01" value="${draftOrder.frete}" oninput="syncDraftValues();getEl('quote_total_display').textContent=formatCurrency(calculateOrderTotal(draftOrder))"></div>
            <div><label>Outros (R$)</label><input id="quote_others" type="number" step="0.01" value="${draftOrder.outros || 0}" oninput="syncDraftValues();getEl('quote_total_display').textContent=formatCurrency(calculateOrderTotal(draftOrder))"></div>
            <div><label>Observações do Pedido</label><input id="quote_obs" placeholder="Observações para impressão..." value="${escapeHtml(draftOrder.obs || '')}" oninput="syncDraftValues()"></div>
          </div>

          <p style="font-size:17px;margin:12px 0">Valor Total do Pedido: <b id="quote_total_display" style="font-family:var(--font-serif);color:var(--pri);font-size:22px">${formatCurrency(calculateOrderTotal(draftOrder))}</b></p>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button onclick="saveQuote(false, false)">Salvar Orçamento</button>
            <button onclick="saveQuote(false, true)">${icon('printer')} Salvar Orçamento e Imprimir / PDF</button>
            <button class="dark-btn" onclick="saveQuote(true, false)">${icon('bolt')} Salvar Pedido</button>
            <button onclick="saveQuote(true, true)" style="background:var(--ok)">${icon('printer')} Salvar Pedido e Já Imprimir</button>
            <button class="secondary" onclick="closeModal()">Cancelar</button>
          </div>
        </div>`);

      if (draftOrder.codeInput) {
        onCodeInputLookup(draftOrder.codeInput);
      }
    }

    function addQuoteItem() {
      syncDraftValues();
      let product = lookedUpProduct || database.prod.find(x => x.id === getVal('quote_item'));
      const quantity = Number(getVal('quote_qty'));
      const discount = Number(getVal('quote_discount'));

      if (!product) {
        return showToast('Digite um código válido (ex: VM250100) ou selecione um produto na lista.');
      }
      if (!isProductActive(product)) {
        return showToast(`Bloqueado: O produto ${product.sku} (${product.nome}) está com Ativo = Não!`);
      }
      if (!(quantity > 0) || discount < 0 || discount > 100) {
        return showToast('Informe quantidade maior que zero e desconto entre 0 e 100%');
      }

      draftOrder.itens.push({ p: product.id, q: quantity, pu: product.preco, d: discount });
      draftOrder.codeInput = '';
      lookedUpProduct = null;
      renderQuoteModal();
    }

    const TERM_OPTIONS = ['À Vista', '7 Dias', '14 Dias', '21 Dias', '28 Dias', '30 Dias', '45 Dias', '60 Dias', '90 Dias'];

    const termDays = cond => {
      const text = String(cond || '').trim();
      if (/vista/i.test(text)) return 0;
      const found = text.match(/(\d+)/);
      return found ? Number(found[1]) : 30;
    };

    const termOptionsHtml = selected => {
      const current = String(selected || '30 Dias').trim();
      const list = TERM_OPTIONS.some(o => o.toLowerCase() === current.toLowerCase()) ? TERM_OPTIONS : [...TERM_OPTIONS, current];
      return list.map(o => `<option value="${escapeHtml(o)}" ${o.toLowerCase() === current.toLowerCase() ? 'selected' : ''}>${escapeHtml(o)}</option>`).join('');
    };

    const priceLockPct = () => {
      const v = Number(database.cfg?.maxPreco);
      return Number.isFinite(v) && v >= 0 ? v : 10;
    };

    function checkPriceLock(prodId, value) {
      if (isAdmin()) return { ok: true };
      const prod = database.prod.find(p => p.id === prodId);
      const base = Number(prod?.preco) || 0;
      if (!(base > 0)) return { ok: true };
      const limit = priceLockPct();
      const min = Math.round(base * (1 - limit / 100) * 10000) / 10000;
      const max = Math.round(base * (1 + limit / 100) * 10000) / 10000;
      if (value < min - 0.00005 || value > max + 0.00005) {
        return {
          ok: false,
          msg: `${prod.sku}: o preço deve ficar entre ${formatCurrency(min)} e ${formatCurrency(max)} (±${formatNumber(limit, 1)}% do catálogo). Acima disso só o administrador altera.`
        };
      }
      return { ok: true };
    }

    function setQuoteItemQty(idx, raw) {
      syncDraftValues();
      const item = draftOrder.itens[idx];
      if (!item) return;
      const value = Number(String(raw).trim().replace(',', '.'));
      if (!isFinite(value) || value <= 0) {
        showToast('Informe uma quantidade maior que zero.');
        return renderQuoteModal();
      }
      item.q = value;
      renderQuoteModal();
    }

    function setQuoteItemDiscount(idx, raw) {
      syncDraftValues();
      const item = draftOrder.itens[idx];
      if (!item) return;
      const value = Number(String(raw).trim().replace(',', '.')) || 0;
      if (value < 0 || value > 100) {
        showToast('O desconto deve ficar entre 0 e 100%.');
        return renderQuoteModal();
      }
      item.d = value;
      renderQuoteModal();
    }

    function setQuoteItemPrice(idx, raw) {
      syncDraftValues();
      const item = draftOrder.itens[idx];
      if (!item) return;
      const value = Math.round(Number(String(raw).trim().replace(',', '.')) * 10000) / 10000;
      if (!isFinite(value) || value <= 0) {
        showToast('Informe um preço unitário maior que zero.');
        return renderQuoteModal();
      }
      const check = checkPriceLock(item.p, value);
      if (!check.ok) {
        showToast(check.msg);
        return renderQuoteModal();
      }
      item.pu = value;
      draftOrder.markupBackup = null;
      renderQuoteModal();
    }

    function setPriceLock(raw) {
      if (!isAdmin()) return;
      const value = Math.max(0, Number(String(raw).trim().replace(',', '.')) || 0);
      database.cfg.maxPreco = value;
      addAuditLog(`Variação máxima de preço no orçamento/pedido alterada para ±${formatNumber(value, 1)}%`);
      saveData();
      refreshView();
      showToast(`Limite de variação de preço: ±${formatNumber(value, 1)}%.`);
    }

    function saveQuote(directOrder = false, openPrintAfter = false) {
      syncDraftValues();
      const client = database.cli.find(x => x.id === draftOrder.cli);
      if (!client || !draftOrder.itens.length) return showToast('Escolha o cliente e adicione ao menos um cabo/produto.');
      if (!isAdmin()) {
        const blocked = draftOrder.itens.find(i => !checkPriceLock(i.p, i.pu).ok);
        if (blocked) return showToast(checkPriceLock(blocked.p, blocked.pu).msg);
      }

      const sellerName = (draftOrder.vendNome || '').trim() || currentUser.nome;

      const quote = {
        id: nextId(),
        n: nextSeqNumber('o'),
        cli: client.id,
        vend: currentUser.role === 'vendedor' ? currentUser.id : (client.vend || currentUser.id),
        vendNome: sellerName,
        data: Date.now(),
        dataEntrega: draftOrder.dataEntrega || todayIso(),
        itens: draftOrder.itens,
        frete: draftOrder.frete,
        outros: draftOrder.outros || 0,
        parc: draftOrder.parc,
        formaPag: draftOrder.formaPag || 'CHEQUE',
        condPag: draftOrder.condPag || '30 Dias',
        obs: draftOrder.obs || '',
        st: directOrder ? 'Aprovado pelo cliente' : 'Rascunho',
        ped: null,
        hist: [[Date.now(), currentUser.nome, 'Criado']]
      };

      database.orc.push(quote);
      addAuditLog(`Orçamento ${quote.n} criado (Vendedor: ${sellerName})`);

      if (directOrder) {
        const newOrder = convertToOrder(quote.id);
        closeModal();
        if (openPrintAfter && newOrder) {
          openPrintPreview('ped', newOrder.id);
        }
        return;
      }

      saveData();
      closeModal();
      refreshView();
      if (openPrintAfter) {
        openPrintPreview('orc', quote.id);
      }
    }

    function updateQuoteStatus(id, newStatus) {
      const quote = database.orc.find(x => x.id === id);
      if (!quote || quote.ped) return;
      if (!isManager() && quote.vend !== currentUser.id) {
        showToast('Só o vendedor responsável ou um gerente pode alterar este registro.');
        return refreshView();
      }
      quote.st = newStatus;
      quote.hist.push([Date.now(), currentUser.nome, `Status: ${newStatus}`]);
      addAuditLog(`Orçamento ${quote.n}: ${newStatus}`);
      saveData();
      refreshView();
    }

    function localIso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatSalesDate(iso) {
      const [y, m, d] = String(iso).split('-');
      return y && m && d ? `${d}/${m}/${y}` : '—';
    }

    function ensureSalesPeriod() {
      if (salesFrom && salesTo) return;
      const now = new Date();
      salesFrom = localIso(new Date(now.getFullYear(), now.getMonth(), 1));
      salesTo = localIso(now);
    }

    function setSalesPeriod(from, to) {
      if (!from || !to) return showToast('Informe as duas datas do período.');
      if (from > to) return showToast('A data inicial não pode ser maior que a final.');
      salesFrom = from;
      salesTo = to;
      refreshView();
    }

    function quickSalesPeriod(kind) {
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      if (kind === 'hoje') {
        salesFrom = localIso(now);
        salesTo = localIso(now);
      } else if (kind === 'mes') {
        salesFrom = localIso(new Date(y, m, 1));
        salesTo = localIso(now);
      } else if (kind === 'passado') {
        salesFrom = localIso(new Date(y, m - 1, 1));
        salesTo = localIso(new Date(y, m, 0));
      } else {
        salesFrom = localIso(new Date(y, 0, 1));
        salesTo = localIso(now);
      }
      refreshView();
    }

    function recordTime(value) {
      if (typeof value === 'string') {
        const t = Date.parse(value);
        return isNaN(t) ? 0 : t;
      }
      return Number(value) || 0;
    }

    function getBilledRecords() {
      const fromInvoices = filterByOwnership(database.fat).filter(f => !f.imp).map(f => {
        const ped = database.ped.find(p => p.id === f.ped);
        return {
          inv: f,
          fatNum: String(f.n),
          pedNum: ped ? String(ped.n) : '—',
          cli: f.cli,
          vend: f.vend,
          vendNome: ped ? getSellerDisplayName(ped) : getEntityName('users', f.vend),
          data: f.data,
          liq: Number(f.liq) || 0,
          total: Number(f.total) || 0
        };
      });
      const legacy = filterByOwnership(database.ped)
        .filter(p => p.st === 'Faturado' && !database.fat.some(f => f.ped === p.id))
        .map(p => ({
          inv: null,
          fatNum: 'PED',
          pedNum: String(p.n),
          cli: p.cli,
          vend: p.vend,
          vendNome: getSellerDisplayName(p),
          data: p.data,
          liq: sumCollection(p.itens, i => i.q * i.pu * (1 - i.d / 100)),
          total: calculateOrderTotal(p)
        }));
      return [...fromInvoices, ...legacy];
    }

    function getSalesRows() {
      ensureSalesPeriod();
      const from = new Date(`${salesFrom}T00:00:00`).getTime();
      const to = new Date(`${salesTo}T23:59:59.999`).getTime();
      return getBilledRecords()
        .filter(r => {
          const t = recordTime(r.data);
          return t >= from && t <= to;
        })
        .sort((a, b) => recordTime(b.data) - recordTime(a.data));
    }

    function exportSalesReport() {
      const rows = getSalesRows();
      if (!rows.length) return showToast('Não há vendas no período para exportar.');
      const data = rows.map(r => {
        const fin = r.inv ? invoiceFinance(r.inv) : null;
        return {
          'Fatura': r.fatNum,
          'Pedido': r.pedNum,
          'Data': formatDate(r.data),
          'Cliente': getEntityName('cli', r.cli),
          'Vendedor': r.vendNome,
          'Líquido itens': Math.round(r.liq * 100) / 100,
          'Total faturado': Math.round(r.total * 100) / 100,
          'Recebido': fin ? fin.pago : '',
          'Saldo a receber': fin ? fin.saldo : '',
          'Entrega': r.inv ? (r.inv.ent ? formatDate(r.inv.ent) : 'A entregar') : '',
          'Pagamento': fin ? (fin.paga ? 'Pago' : fin.pago > 0.004 ? 'Parcial' : 'Não pago') : ''
        };
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), 'Vendas');
      XLSX.writeFile(wb, `relatorio-vendas-${salesFrom}-a-${salesTo}.xlsx`);
    }

    function invoiceFinance(inv) {
      const parcelas = database.rec.filter(r => r.fat === inv.id);
      const valor = Math.round(sumCollection(parcelas, r => r.valor) * 100) / 100;
      const pago = Math.round(sumCollection(parcelas, r => r.pago) * 100) / 100;
      const saldo = Math.round((valor - pago) * 100) / 100;
      const abertas = parcelas.filter(r => r.valor - r.pago > 0.004).sort((a, b) => a.venc - b.venc);
      return {
        parcelas,
        valor,
        pago,
        saldo,
        paga: parcelas.length > 0 && saldo < 0.005,
        proxVenc: abertas.length ? abertas[0].venc : null
      };
    }

    function deliveryBadge(inv) {
      if (inv.imp) return '<span class="mut">—</span>';
      return inv.ent
        ? `<span class="dot-ok">ENTREGUE</span><br><small class="mut">${formatDate(inv.ent)}</small>`
        : '<span class="dot-warn">A ENTREGAR</span>';
    }

    function paidMethodsLabel(inv) {
      const methods = [];
      (Array.isArray(inv.pagtos) ? inv.pagtos : []).forEach(p => (p.linhas || []).forEach(l => {
        if (!methods.includes(l.forma)) methods.push(l.forma);
      }));
      return methods.length ? `<br><small class="mut">${escapeHtml(methods.join(' + '))}</small>` : '';
    }

    function paymentBadge(inv) {
      const fin = invoiceFinance(inv);
      if (!fin.parcelas.length) return '<span class="mut">—</span>';
      if (fin.paga) {
        return `<span class="dot-ok">PAGO</span>${inv.pagoEm ? `<br><small class="mut">${formatDate(inv.pagoEm)}</small>` : ''}${paidMethodsLabel(inv)}`;
      }
      if (fin.pago > 0.004) {
        return `<span class="dot-warn">PARCIAL</span><br><small class="mut">saldo ${formatCurrency(fin.saldo)}</small>${paidMethodsLabel(inv)}`;
      }
      return '<span class="dot-bad">NÃO PAGO</span>';
    }

    function clientReceivableTitles(cliId) {
      const titles = [];
      database.fat.filter(f => f.cli === cliId).forEach(inv => {
        database.rec.filter(r => r.fat === inv.id && r.valor - r.pago > 0.004).forEach(r => titles.push({ r, inv }));
      });
      return titles.sort((a, b) => (a.r.venc || 0) - (b.r.venc || 0));
    }

    function openClientReceivables(cliId) {
      const titles = clientReceivableTitles(cliId);
      if (!titles.length) return showToast('Este cliente não tem valores em aberto.');
      const dayStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
      const today = dayStart(Date.now());
      const money = v => `<span style="white-space:nowrap">${formatCurrency(v)}</span>`;
      let totalValor = 0;
      let totalSaldo = 0;
      let totalVencido = 0;

      const rowsHtml = titles.map(({ r, inv }) => {
        const ped = database.ped.find(p => p.id === inv.ped);
        const saldo = roundMoney(r.valor - r.pago);
        const diff = Math.round((dayStart(r.venc) - today) / 86400000);
        totalValor += Number(r.valor) || 0;
        totalSaldo += saldo;
        if (diff < 0) totalVencido += saldo;
        const status = diff < 0
          ? '<span class="dot-bad">VENCIDA</span>'
          : diff === 0
            ? '<span class="dot-warn">HOJE</span>'
            : `<span class="mut" style="font-size:11px">EM ${diff} DIA${diff > 1 ? 'S' : ''}</span>`;
        const desc = inv.imp
          ? escapeHtml(r.ref || `PEDIDO DE VENDA Nº ${inv.pedNum || ''}`)
          : `PEDIDO DE VENDA Nº ${escapeHtml(ped ? ped.n : '—')}${ped && ped.formaPag ? ` [${escapeHtml(ped.formaPag)}]` : ''}`;
        const sub = `PARCELA ${escapeHtml(r.parc || '1/1')}${inv.imp ? '' : ` · FATURA ${escapeHtml(inv.n)}`}`;
        const pay = isManager()
          ? `<td><button class="dark-btn" style="padding:5px 10px;font-size:12px" onclick="openInvoicePaymentConfirm('${inv.id}')">${icon('dollar')} Pagamento</button></td>`
          : '';
        return `<tr>
          <td><input type="checkbox" class="rec-pick" data-val="${saldo}" onchange="updateClientReceivablesSum()"></td>
          <td style="white-space:nowrap"><b>${formatDate(r.venc)}</b><br>${status}</td>
          <td><b>${desc}</b><br><small class="mut">${sub}</small></td>
          <td style="text-align:right">${money(r.valor)}</td>
          <td style="text-align:right"><b>${money(saldo)}</b></td>
          ${pay}
        </tr>`;
      }).join('');

      const cols = isManager() ? 6 : 5;
      openModal(`
        <h3>${escapeHtml(getEntityName('cli', cliId).toUpperCase())}</h3>
        <p class="mut">${titles.length} parcela${titles.length > 1 ? 's' : ''} em aberto${totalVencido > 0.004 ? ` · Vencido: <b style="color:var(--bad, #b91c1c)">${formatCurrency(totalVencido)}</b>` : ''}</p>
        <div class="table-wrapper tw-compact">
          <table>
            <thead><tr>
              <th style="width:34px"><input type="checkbox" onchange="toggleClientReceivables(this.checked)" title="Marcar todas"></th>
              <th>VENCIMENTO</th><th>PEDIDO / PARCELA</th><th style="text-align:right">VALOR</th><th style="text-align:right">SALDO</th>${isManager() ? '<th></th>' : ''}
            </tr></thead>
            <tbody>${rowsHtml}</tbody>
            <tfoot><tr style="border-top:2px solid var(--line, #cbd5e1)">
              <td colspan="3"><b>TOTAL EM ABERTO</b></td>
              <td style="text-align:right;font-family:var(--font-serif);font-size:17px">${money(roundMoney(totalValor))}</td>
              <td style="text-align:right;font-family:var(--font-serif);font-size:17px"><b>${money(roundMoney(totalSaldo))}</b></td>
              ${isManager() ? '<td></td>' : ''}
            </tr></tfoot>
          </table>
        </div>
        <p style="font-size:16px;margin-top:12px">Selecionadas: <b id="rec_pick_sum" style="font-family:var(--font-serif);font-size:20px">${formatCurrency(0)}</b> <small class="mut" id="rec_pick_count"></small></p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="secondary" onclick="closeModal()">Fechar</button>
        </div>`);
    }

    function updateClientReceivablesSum() {
      const picked = [...document.querySelectorAll('#modal-container .rec-pick:checked')];
      const total = roundMoney(sumCollection(picked, el => Number(el.dataset.val) || 0));
      const sumEl = getEl('rec_pick_sum');
      const countEl = getEl('rec_pick_count');
      if (sumEl) sumEl.textContent = formatCurrency(total);
      if (countEl) countEl.textContent = picked.length ? `(${picked.length} parcela${picked.length > 1 ? 's' : ''})` : '';
    }

    function toggleClientReceivables(checked) {
      document.querySelectorAll('#modal-container .rec-pick').forEach(el => { el.checked = checked; });
      updateClientReceivablesSum();
    }

    function invoiceActionsHtml(inv, reopenOrderId = '') {
      const ro = `'${reopenOrderId}'`;
      const fin = invoiceFinance(inv);
      const small = 'padding:5px 10px;font-size:12px';
      const delivery = inv.imp ? '' : inv.ent
        ? `<button class="secondary" style="${small}" onclick="undoInvoiceDelivery('${inv.id}', ${ro})">Desfazer entrega</button>`
        : `<button style="${small}" onclick="confirmInvoiceDelivery('${inv.id}', ${ro})">${icon('save')} Confirmar entrega</button>`;
      let payment = '';
      if (isManager() && fin.parcelas.length) {
        const lancamentos = Array.isArray(inv.pagtos) ? inv.pagtos.length : 0;
        if (!fin.paga) {
          payment += `<button class="dark-btn" style="${small}" onclick="openInvoicePaymentConfirm('${inv.id}', ${ro})">${icon('dollar')} ${fin.pago > 0.004 ? 'Lançar pagamento' : 'Confirmar pagamento'}</button>`;
        }
        if (lancamentos || inv.pagoSnap) {
          payment += `<button class="secondary" style="${small}" onclick="undoInvoicePayment('${inv.id}', ${ro})">${lancamentos > 1 ? 'Desfazer último pagamento' : 'Desfazer pagamento'}</button>`;
        }
      }
      return `<div style="display:flex;gap:6px;flex-wrap:wrap">${delivery}${payment}</div>`;
    }

    function orderFlowBadges(order) {
      const invoices = database.fat.filter(f => f.ped === order.id);
      if (!invoices.length) return '';
      const delivered = invoices.every(f => f.ent);
      const paid = invoices.every(f => invoiceFinance(f).paga);
      return `<br><span class="${delivered ? 'dot-ok' : 'dot-warn'}">${delivered ? 'ENTREGUE' : 'A ENTREGAR'}</span><br><span class="${paid ? 'dot-ok' : 'dot-bad'}">${paid ? 'PAGO' : 'A RECEBER'}</span>`;
    }

    function renderOrderInvoices(order) {
      const invoices = database.fat.filter(f => f.ped === order.id);
      if (!invoices.length) return '';
      return `
        <p style="margin:16px 0 6px"><b>Faturas deste pedido</b></p>
        ${renderTable(['FATURA', 'EMISSÃO', 'TOTAL', 'ENTREGA', 'PAGAMENTO', 'AÇÕES'], invoices.map(f => [
          `<span class="num-serif">${escapeHtml(f.n)}</span>`,
          formatDate(f.data),
